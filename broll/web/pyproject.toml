[project]
name = "broll-web"
version = "0.1.0"
description = "B-Roll Platform -- FastAPI search app + media server (SPEC.md 'web/')"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# fastembed (ONNX, no torch) is an OPTIONAL dependency -- app/semantic.py
# imports it lazily and degrades to "no semantic contribution" if it isn't
# installed. Not in the base `dependencies` list on purpose; install this
# extra to enable semantic search.
semantic = [
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
