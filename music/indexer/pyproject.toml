[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-indexer"
version = "0.1.0"
description = "Music platform indexer: decode, CLAP embed, DSP features, vocabulary tagging, ingest."
requires-python = ">=3.12"
# Base rig only -- this half needs the RTX 3080 and a local ffmpeg. torch here
# is deliberate and is the reason it never runs in the NAS container.
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=4.40",
    "librosa>=0.11",
    "pyloudnorm>=0.2",
    "soundfile>=0.13",
    # The two exporters only (export_text_encoder.py, and since 2026-08-18
    # export_audio_encoder.py). onnx writes the graph; onnxruntime is here
    # because neither exporter will ship an artefact it has not loaded the way
    # its consumer will -- the container for the text tower, an editor's
    # companion for the audio tower -- and compared to the full ClapModel. It
    # is a 19 MB wheel and it is the ONLY new dependency the web half gains --
    # see those scripts' docstrings for the ONNX-vs-torch numbers.
    # onnxconverter-common is NOT a dependency: the fp16 copy is optional and
    # the exporter falls back to onnxruntime's own converter, then says it
    # skipped.
    "onnx>=1.16",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# The suite's own dependency, named here so requirements.lock can carry it
# with a hash -- CI installs `--require-hashes` and cannot `pip install pytest`
# on the side (2026-08-17, COMMERCIAL_READINESS.md item 13).
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["music_index*"]

# `cd music/indexer && python -m pytest tests -q` on the SYSTEM interpreter --
# there is deliberately no venv here and the suite deliberately imports no
# torch: what it covers is the required-path surface (music_index/config.py),
# which is the half a machine without the GPU can still get wrong. The CLAP
# half is exercised by running the indexer, not by unit tests.
[tool.pytest.ini_options]
testpaths = ["tests"]

# The storage layer (musicweb.db) and schema.sql live in ../web and are shared:
# this package writes the database the web app reads. music_index/__init__.py
# puts ../web on sys.path for that reason -- see its docstring.
