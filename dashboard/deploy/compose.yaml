# Compose for ccsync-dashboard -- A TEMPLATE since 2026-08-17.
#
# `{{ NAME }}` placeholders (written without the spaces) are filled in by
# server/install_dashboard_app.render_compose_yaml() from site.toml and the
# backend; every other `${VAR}` is compose's own runtime substitution and is
# left alone. Rendered with this site's values it is byte-for-byte the file it
# has always been (server/tests/test_compose_template.py diffs the render
# against the pre-templating copy in server/tests/fixtures/). The variables:
#
#   NAS_APPS_ROOT     where the app's own host tree lives -- TrueNAS
#                     /mnt/<pool>/apps/ccsync-dashboard, Synology
#                     /volume1/docker/ccsync ([apps] root)
#   NAS_TREE_ROOT     the Creators Club tree root the fleet syncs
#                     ([tree] pool_root + tree_name)
#   APP_UID/APP_GID   the uid:gid the container runs as -- the owner:group
#                     setup_tree.py chowns the tree to (3000:3001 =
#                     broll:editors here; DSM assigns >= 1026, so it MUST be
#                     read from the live account there, not assumed)
#   DASH_PORT_BINDS   one `- "<addr>:<port>:<port>"` line per published
#                     interface (LAN + tailnet on TrueNAS; 127.0.0.1 only on
#                     Synology, where tailscaled runs in userspace mode and
#                     `tailscale serve` publishes the loopback port)
#   SYNCTHING_URL     Syncthing's GUI as seen FROM THE CONTAINER
#   NAS_HOST/NAS_USER/NAS_ADMIN_USERS/DASH_PORT
#
# server/install_dashboard_app.py builds the same structure as a Python dict
# (compose_config(), from the same variables -- keep the two in sync; the tests
# diff them) and injects the secrets from env vars. This file is the manual
# fallback: TrueNAS UI > Apps > Discover Apps > ... > Install via
# YAML -- render it, paste it and fill in EVERY REPLACE_ME value:
#   SYNCTHING_API_KEY, DASH_REPORT_TOKEN, DASH_SESSION_SECRET,
#   BROLL_INGEST_TOKEN, TRUENAS_PW
# None of them is optional-by-omission: BROLL_INGEST_TOKEN in particular is
# rejected (the container refuses to start) while DASH_BROLL_ENABLED is "1",
# because it guards a write path no session protects. Set DASH_BROLL_ENABLED
# to "0" if you do not want the b-roll UI at all.
#
# Prereqs (the install script does these): host dirs
#   {{NAS_APPS_ROOT}}/app   (the dashboard/ tree from this repo;
#     owned root:root, world-readable, NOT group-writable -- editors have
#     shell accounts in group 3001, and a writable code mount here was an
#     editor->NAS-admin escalation via run.sh, AUDIT C-1)
#   {{NAS_APPS_ROOT}}/venv  (the dependency venv; owned
#     3000:3000, mode 700 -- see AUDIT C-2 and deploy/run.sh)
#   {{NAS_APPS_ROOT}}/data  (SQLite + companion packages,
#     persistent; owned 3000:3000, mode 770 -- group 3000, NOT 3001/editors:
#     it used to be group-writable by every editor while run.sh exec'd a
#     python interpreter out of it)
#   {{NAS_APPS_ROOT}}/broll-web  (this repo's broll/web tree;
#     root:root 755, mounted :ro. The install script SHIPS this -- an empty
#     dir here means /broll is silently absent, so do not create it by hand
#     and expect the feature to work)
#   "{{NAS_TREE_ROOT}}/Assets/B-roll Archive"  (the
#     b-roll data root, which is the SMB-visible shared archive itself: owned
#     broll:editors 2770 setgid, exactly like Projects/. NOT 770 group-3000 --
#     that would lock the editors who browse it out of their own archive)
#   {{NAS_APPS_ROOT}}/music-web  (this repo's music/web tree;
#     root:root 755, mounted :ro. SHIPPED by the install script -- an empty
#     dir here means /music is silently absent, exactly like broll-web)
#   {{NAS_APPS_ROOT}}/music-data  (music.db + the ingest
#     staging/ dir; owned 3000:3000 mode 770 -- the ONLY music path the
#     container writes)
#   {{NAS_APPS_ROOT}}/music-encoder,
#   {{NAS_APPS_ROOT}}/music-proxies  (read-only artefacts,
#     ~482 MB and ~906 MB; shipped on demand with --music-data, not on every
#     deploy)
#   {{NAS_APPS_ROOT}}/ffmpeg  (static ffmpeg + ffprobe, put
#     there by the install script -- NOTHING BUILDS THIS IMAGE and the
#     container is unprivileged, so it cannot install them itself)
#   {{NAS_APPS_ROOT}}/ytdl-web  (this repo's ytdl/web tree;
#     root:root 755, mounted :ro. SHIPPED by the install script -- an empty
#     dir here means /ytdl is silently absent, exactly like broll-web)
#   {{NAS_APPS_ROOT}}/ytdl-data  (ytdl.db + the worker's
#     scratch; owned 3000:3000 mode 770 -- the ONLY ytdl path the container
#     writes that is not inside Projects/)
#   {{NAS_APPS_ROOT}}/deno  (a static deno -- the JS runtime yt-dlp answers
#     YouTube's "n challenge" with; root:root 755, put there by the install
#     script for the same reason as ffmpeg: nothing builds this image. NOT
#     PART OF THE DEFAULT DEPLOY: the mount and the service below appear only
#     when the customer's site.toml sets [features] youtube_unblock -- see
#     docs/legal/YOUTUBE_FEATURE_NOTICE.md. The file you are reading is the
#     DEFAULT shape, which carries neither.)
#   (claude-home / claude-bin are gone as of 2026-08-17: the /ytdl AI calls
#     use the anthropic SDK with the customer's ANTHROPIC_API_KEY, so there is
#     no CLI binary and no OAuth credential volume.)
#   "{{NAS_TREE_ROOT}}/Assets/Music"  (the music library
#     itself, P:\Assets\Music to an editor: broll:editors 2770 setgid like
#     Projects/, mounted rw because queued ingest writes accepted uploads
#     into it)
services:
  dashboard:
    # Pinned: an unpinned python:3.12-slim silently changes underneath a
    # redeploy. Bump this tag deliberately (and re-run the tests) rather than
    # inheriting whatever 3.12.x is current.
    image: python:3.12.7-slim
    user: "{{APP_UID}}:{{APP_GID}}"
    command: ["/bin/sh", "/app/deploy/run.sh"]
    environment:
      SYNCTHING_GUI_URL: "{{SYNCTHING_URL}}"
      SYNCTHING_API_KEY: "REPLACE_ME"
      DASH_REPORT_TOKEN: "REPLACE_ME"
      # Whether that ONE shared token is still accepted, beside the per-editor
      # tokens an admin mints on Admin > Users (COMMERCIAL_READINESS.md item
      # 15, 2026-08-17). Left on ("1") because every companion in the field
      # holds only the shared one; the dashboard names the machines still using
      # it at every boot, and once that list is empty this becomes "0" -- which
      # is the point of the per-editor tokens: revocable per person, not one
      # leak away from the whole fleet. Only an explicit "0" turns it off.
      DASH_SHARED_REPORT_TOKEN_ENABLED: "1"
      # Login sessions: any stable random string; keep it the same across
      # redeploys or everyone is logged out. SMB auth verifies TrueNAS
      # passwords (the only method that works for non-admin users on 25.10).
      DASH_SESSION_SECRET: "REPLACE_ME"
      DASH_ADMIN_USERS: "{{NAS_ADMIN_USERS}}"
      # The host the editor-login SMB probe authenticates against -- the NAS
      # itself. NOT optional: with it unset the dashboard boots, says "site
      # identity not fully configured" once, and then refuses every editor
      # login. Nothing in the deploy set it between the WP0 de-tenanting and
      # 2026-08-17, when the Synology bring-up printed that line.
      DASH_SMB_HOST: "{{SMB_HOST}}"
      # "auto" honours X-Forwarded-Proto (the DSM reverse proxy and
      # `tailscale serve` both set it); "1" pins Secure on the session cookie,
      # which is what an https-published dashboard wants.
      DASH_COOKIE_SECURE: "{{DASH_COOKIE_SECURE}}"
      # WHOSE X-Forwarded-* THIS DASHBOARD BELIEVES, and with it what
      # auth.client_ip calls "the client" (trust-model-3, 2026-08-21).
      # Nothing set it until then, so every deployment ran on the dashboard's
      # own default of loopback only -- which this container never sees. The
      # stack publishes its port with `ports:` below, so a connection
      # `tailscale serve` makes from the NAS host is NATed and arrives FROM
      # THE DOCKER BRIDGE GATEWAY: with that peer untrusted, every request in
      # the fleet shared one client IP, so the login throttle's per-IP budget
      # (5 failures, then backoff doubling to an hour) was ONE bucket for
      # everybody and one editor with caps lock on could 429 /login and
      # /api/v1/verify for every editor and every companion.
      #
      # Rendered from site.toml [net] trusted_proxies, else loopback + [net]
      # docker_bridge_cidr (default 172.16.0.0/12) + this node's tailnet
      # address. See install_dashboard_app.trusted_proxies_for for why
      # trusting the bridge is the smaller exposure of the two.
      DASH_TRUSTED_PROXIES: "{{DASH_TRUSTED_PROXIES}}"
      DASH_DB_PATH: "/data/dashboard.db"
      # Opt-in crash reporting (COMMERCIAL_READINESS.md item 13). The container
      # ALWAYS writes crash JSON here and sends it NOWHERE; setting
      # DASH_SENTRY_DSN is the whole of turning the network sender on. Inside
      # /data on purpose -- the one persistent volume, so a crash that killed
      # the container is still readable afterwards. docs/legal/TELEMETRY.md.
      # DASH_SENTRY_DSN: ""
      DASH_CRASH_DIR: "/data/crashes"
      DASH_PORT: "{{DASH_PORT}}"
      # auto-provision Syncthing folders for new project dirs found here
      DASH_PROJECTS_DIR: "/projects"
      # --- b-roll search UI, mounted in-process at /broll ------------------
      # "1" to serve it; anything else and nothing is mounted and the b-roll
      # volumes below are unused. Editors then reach search on the SAME host,
      # port and login as this dashboard.
      DASH_BROLL_ENABLED: "{{DASH_BROLL_ENABLED}}"
      BROLL_DATA_ROOT: "/broll-data"
      BROLL_SHARES: "broll:Main b-roll archive"
      # Shares that hold OUR OWN footage rather than downloads; they browse
      # under the own-footage root below instead of the subject taxonomy.
      # This was the literal "mofa-disaster" -- ONE CUSTOMER'S PROJECT NAME,
      # in the file every operator pastes -- until 2026-08-21
      # (product-surface-3). site.toml [broll] creators_shares; blank means
      # the whole archive browses as Downloads, which is the right answer for
      # a site that has not said. A manifest with no [broll] table at all
      # still renders the historical value for one more release: see
      # install_dashboard_app.broll_creators_shares_default().
      BROLL_CREATORS_SHARES: "{{BROLL_CREATORS_SHARES}}"
      # ...and the top-level FOLDER those shoots are ingested under, inside
      # the archive tree: <archive root>/<this>/<share>/<shoot dirs>/. Blank
      # leaves broll/web's own default, which cannot change on its own -- the
      # ~7,000 files already published sit under it. site.toml [broll]
      # archive_creators_dir (product-surface-3, 2026-08-21).
      BROLL_ARCHIVE_CREATORS_DIR: "{{BROLL_ARCHIVE_CREATORS_DIR}}"
      # What that own-footage collection is CALLED -- a slug that travels in
      # every search URL, and the label the folder tree shows. It was the
      # literal "creators_club" (one customer's name) until 2026-08-17
      # (COMMERCIAL_READINESS.md item 10); blank leaves the neutral "owned" /
      # "Our Footage" the app defaults to. site.toml [broll]
      # default_collection / default_collection_label.
      BROLL_DEFAULT_COLLECTION: "{{BROLL_DEFAULT_COLLECTION}}"
      BROLL_DEFAULT_COLLECTION_LABEL: "{{BROLL_DEFAULT_COLLECTION_LABEL}}"
      # MANDATORY when the mount is enabled, and checked at startup: a blank,
      # placeholder or short value makes the container REFUSE TO START with
      # DASH_BROLL_ENABLED=1 (ccsync_dashboard.broll.check_ingest_token).
      # /broll/api/ingest/* is a write path the indexer reaches with no
      # session at all, so this is a credential -- generate it, do not leave
      # the literal below in place:  openssl rand -hex 24
      BROLL_INGEST_TOKEN: "REPLACE_ME"
      # --- music search UI, mounted in-process at /music -------------------
      # There is deliberately NO DASH_MUSIC_ENABLED and no ingest token here.
      # b-roll needs both because /broll/api/ingest/* is a write path reached
      # with no session; nothing under /music is exempt from login_gate, so
      # the session IS the credential and SHIPPING THE TREE IS THE SWITCH --
      # a host whose <host-root>/music-web is empty reports the mount "absent"
      # and hides the nav link. See music/web/DEPLOY.md.
      #
      # All four are MUSIC_-prefixed. musicweb still honours bare
      # DATA_ROOT/MUSIC_ROOT as fallbacks, but this environment is shared with
      # the dashboard and the b-roll mount (which namespaces everything
      # BROLL_*), and a bare DATA_ROOT in it is a collision waiting to happen.
      #
      # MUSIC_DATA_ROOT is the only WRITABLE one: music.db and the ingest
      # staging/ dir live there. A read-only data root is the DEGRADED state
      # the mount exists to report.
      MUSIC_DATA_ROOT: "/music-data"
      MUSIC_SHARE_ROOT: "/music-share"
      MUSIC_PROXIES_DIR: "/music-proxies"
      MUSIC_TEXT_ENCODER_DIR: "/music-encoder"
      # --- YouTube downloader UI, mounted in-process at /ytdl --------------
      # No flag and no token, for the same reason as music: nothing under
      # /ytdl is exempt from login_gate, so the session IS the credential and
      # shipping the tree is the switch.
      #
      # YTDL_DATA_ROOT is the only writable one (ytdl.db + scratch). The other
      # three are what the sub-app reaches THROUGH:
      #   YTDL_PROJECTS_ROOT  where finished clips land, as
      #                       <label>/Youtube/<term>/ -- the same /projects
      #                       tree the dashboard provisions and sync
      #                       distributes, not a private copy.
      #   YTDL_DASH_DB        the dashboard's own SQLite, opened READ-ONLY
      #                       (file:...?mode=ro) for the caller's ticked
      #                       projects. Same container, same uid, WAL.
      YTDL_DATA_ROOT: "/ytdl-data"
      YTDL_PROJECTS_ROOT: "/projects"
      YTDL_DASH_DB: "/data/dashboard.db"
      # The CUSTOMER's Anthropic key: what the two AI calls (search-term
      # expansion, relevance filtering) authenticate with since the `claude`
      # CLI came out on 2026-08-17 (docs/COMMERCIAL_READINESS.md item 1).
      # Blank is a supported state -- /ytdl then reports "no working Anthropic
      # API key" and nothing else on the dashboard is affected. A SECRET: the
      # install script masks it in --dry-run output and, on Synology, writes
      # it to the 0600 .env beside this file rather than into it.
      ANTHROPIC_API_KEY: "REPLACE_ME"
      # yt-dlp DOWNLOADS the EJS challenge solver at first use and caches it.
      # run.sh deliberately exports no HOME, so the default cache path is
      # /.cache -- which uid 3000 cannot create, so the solver would be
      # re-fetched on every single call.
      YTDL_CACHE_DIR: "/ytdl-data/cache"
      # Requester-first YouTube downloads ON (docs/YTDL_LOCAL_DOWNLOAD.md).
      # The SPA-side switch: unset, the page never probes the requester's
      # companion and every job takes the server path -- which is what the
      # fleet silently ran on for two days after 0.7.8 shipped, because
      # nothing set this (2026-08-16). Removing the line is the global
      # rollback; per job it is the "download on the server instead" link.
      YTDL_LOCAL_DOWNLOAD: "1"
      # --- TIMELINE CARDS, hosted here at /cards -------------------------
      # docs/TIMELINE-CARDS-INTO-CCSYNC.md phase 3 (2026-08-30). ALL OF IT IS
      # OPTIONAL and blank is the shipped state: with DASH_CARDS_ENABLED off
      # the dashboard boots exactly as before and /cards reports `disabled`
      # with the reason. On a site that turns it on, these are the same
      # values the standalone container takes as CARDS_*, one for one, so
      # `server.main --remote-agent` and `cards.build_engine` construct the
      # same engine.
      #
      # TWO OF THEM ARE MOUNTS, NOT SETTINGS: the vault at /vault (rw) and
      # the footage share at /media (ro) are added to the volume list by
      # server/install_dashboard_app.py when site.toml's [timeline_cards]
      # names them -- see the note in the volumes block below, and
      # docs/DOCKER.md for the chown the vault needs first.
      DASH_CARDS_ENABLED: "{{DASH_CARDS_ENABLED}}"
      # The MulticamPipeline checkout `multicam_pipeline.cards` is imported
      # from, shipped to the host and mounted read-only exactly as
      # /broll-app is. NOT on PYTHONPATH: it is another repo's tree, it is
      # never in this image or in an over-the-air code bundle, so
      # ccsync_dashboard.cards appends this path itself at mount time.
      DASH_CARDS_SRC: "{{DASH_CARDS_SRC}}"
      DASH_CARDS_VAULT_ROOT: "{{DASH_CARDS_VAULT_ROOT}}"
      # The episode root the page opens on. Blank = the vault root, and the
      # header's root menu walks the rest either way.
      DASH_CARDS_ROOT: "{{DASH_CARDS_ROOT}}"
      # A .cut.md PROJECT FILE to serve instead of the agent's timeline
      # (PROJECT-FORMAT-PLAN §4.1). Blank = the timeline server.
      DASH_CARDS_PROJECT: "{{DASH_CARDS_PROJECT}}"
      # Resolve's project library (PostgreSQL): with it the page comes up
      # with cards from the SAVED timeline before any agent has connected.
      # NOT `localhost` -- the postgres app is another container.
      DASH_CARDS_DB_HOST: "{{DASH_CARDS_DB_HOST}}"
      DASH_CARDS_DB_NAME: "{{DASH_CARDS_DB_NAME}}"
      # Which libraries may be WRITTEN (a conform built straight into
      # Resolve's own database). Blank -- the default -- means no library
      # write is possible and the page says so instead of offering a route
      # that cannot work. Start with the sandbox copy: FF5lab.
      DASH_CARDS_DB_WRITE_ALLOW: "{{DASH_CARDS_DB_WRITE_ALLOW}}"
      DASH_CARDS_DB_BACKUPS: "{{DASH_CARDS_DB_BACKUPS}}"
      # How this container reaches the media the agent names. Single-quoted:
      # the value carries backslashes (`P:\=/media`), and a backslash in a
      # DOUBLE-quoted YAML scalar is an escape character -- TrueNAS parses
      # this file, so it would fail at install rather than at run time.
      # Useless without the /media mount, and vice versa.
      DASH_CARDS_MEDIA_MAP: '{{DASH_CARDS_MEDIA_MAP}}'
      # THE TUNNEL'S TARGET (phase 2), and what happens to it here: with the
      # page mounted above, `/cards/agent/*` calls the engine IN THIS
      # PROCESS and these two are ignored. They stay because a dashboard
      # that has not mounted the page still forwards to the separate
      # container on :8800 -- which is how both origins run side by side
      # during the transition (§7.4).
      DASH_CARDS_SERVER_URL: "{{DASH_CARDS_SERVER_URL}}"
      DASH_CARDS_TOKEN: "REPLACE_ME"
      # WHAT THIS CONTAINER CALLS THE FLEET'S ROOT NAMES, for the jobs it
      # runs ITSELF (TIMELINE-CARDS-INTO-CCSYNC.md phase 4's pin: a media job
      # the fleet spent its retry budget on is handed to the engine mounted
      # above instead of being abandoned). Written by
      # install_dashboard_app.jobs_env from the two mounts it makes, so it
      # cannot disagree with them; `media` is absent when the site names no
      # footage share, because a root that is not mounted must not be
      # advertised. A job naming a root that is not here fails with a
      # sentence, never a guess.
      DASH_JOBS_ROOTS: "{{DASH_JOBS_ROOTS}}"
      # WHICH DATASETS MUST BE IN A SNAPSHOT TASK (2026-09-03). The
      # dashboard's protection panel checks the NAS's snapshot schedule
      # against these two names, and a container sees /projects and /data,
      # never the pool paths behind them -- so the names are a deployment
      # fact it has to be told. Blank is a supported state and renders as
      # CANNOT VERIFY, never as a missing backup. site.toml [tree] dataset /
      # [apps] dataset name them; on TrueNAS the deploy works them out from
      # the roots it already has when they are not set. The apps one is
      # normally the pool root (a plain folder inside `tank` is covered by a
      # task on `tank`).
      DASH_TREE_DATASET: "{{DASH_TREE_DATASET}}"
      DASH_UPDATE_SNAPSHOT_DATASET: "{{DASH_UPDATE_SNAPSHOT_DATASET}}"
      # WHERE THIS CONTAINER CAN READ THOSE SNAPSHOTS (OPS-3, usability +
      # resilience sweep 2026-09-03). Settings -> RECOVERY browses and
      # restores from a snapshot without a root shell, and docs/BACKUP_RESTORE
      # calls that the primary route -- but nothing set this until now, so
      # every documented install got a page that could only print commands.
      # A directory whose ENTRIES are snapshots (`.zfs/snapshot` of the tree's
      # dataset on ZFS, `/volume<N>/@sharesnap/<share>` on DSM), mounted
      # read-only, plus the path from ONE snapshot's root down to Projects.
      # Blank is "this deployment was never given a snapshot mount", which is
      # what the page says; it is NEVER read as "there are no snapshots".
      # Pasting this file? Add the mount to the volumes below as well, e.g.
      #   - /mnt/<pool>/<dataset>/.zfs/snapshot:/snapshots:ro
      DASH_SNAPSHOT_DIR: "{{DASH_SNAPSHOT_DIR}}"
      DASH_SNAPSHOT_PROJECTS_SUBPATH: "{{DASH_SNAPSHOT_PROJECTS_SUBPATH}}"
      # WHICH OPTIONAL FEATURES THIS SITE TURNED ON (2026-08-17,
      # docs/COMMERCIAL_READINESS.md items 2 + 3). BOTH DEFAULT "0", and "0"
      # is what the vendor build ships: the customer decides whether
      # downloading third-party YouTube material is lawful for them, and
      # whether they may run the components that get past YouTube's
      # anti-automation measures. Set from site.toml [features] by the install
      # script; published to every companion by GET /api/v1/site.
      #
      # youtube_download="0" means the dashboard does not mount /ytdl at all:
      # the page, the fleet claim/manifest/status routes and the nav link are
      # simply not there. youtube_unblock="1" additionally brings back the
      # `bgutil` PO-token sidecar, the /opt/deno mount, YTDL_POT_BASE_URL and
      # YTDL_COOKIES_FILE -- the install script adds all four; this default
      # file carries none of them. See docs/legal/YOUTUBE_FEATURE_NOTICE.md.
      DASH_SITE_YOUTUBE_DOWNLOAD: "0"
      DASH_SITE_YOUTUBE_UNBLOCK: "0"
      # Whether the downloader's two AI calls may run a Claude Code / Codex
      # CLI THE CUSTOMER installed on this host (2026-08-18, Settings -> AI
      # providers). "0" is the vendor build. NOTHING IS EVER INSTALLED FOR
      # THIS AT ANY SETTING -- there is no binary in the image, no volume and
      # no download, which is the half of COMMERCIAL_READINESS.md item 1 that
      # was ours; the flag only decides whether we will run one already
      # there, on the customer's own subscription and their own say-so.
      DASH_SITE_AI_CLI_PROVIDERS: "0"
      # Unattended updates (2026-08-18, docs/MULTI_MACHINE_PLAN.md §9). "0"
      # is the vendor build: companions offer a new build in their tray and
      # an admin can push one machine at a time from Settings, Packages. "1"
      # lets a companion apply a NEWER build with nobody clicking -- safe
      # only because every package record is signature-verified by the build
      # already running, and the swap still refuses while a CCSync window is
      # open or media is being copied in.
      DASH_SITE_AUTO_UPDATE: "0"
      # Published companion builds (upgrade channel). Optional: defaults to
      # a "packages" dir next to DASH_DB_PATH, i.e. /data/packages -- which
      # is already persistent. Only set this to move them elsewhere.
      # DASH_PACKAGES_DIR: "/data/packages"
      # The vendor's release public key(s), comma-separated base64
      # (COMMERCIAL_READINESS.md item 4, 2026-08-17). Every published build
      # must carry an Ed25519 signature that verifies against one of these,
      # made by a key that exists on no server. UNSET = publishing is refused
      # (503); everything else keeps working. `python tools/release_key.py
      # pubkey` prints the value.
      DASH_RELEASE_PUBKEYS: ""
      # THE VENDOR RELEASE FEED (ZERO_TOUCH_PLAN.md WP E; wired into the
      # deploy 2026-08-18 -- WP E shipped the client and nothing ever set
      # the URL, so the feature was dark on every deployment). Blank = off:
      # no poller thread, no network call, no auto-publish. It names WHOSE
      # builds this fleet takes, so it is vendor identity written at install
      # rather than a Settings field. A hostile URL still cannot install
      # anything -- every record is re-verified against DASH_RELEASE_PUBKEYS.
      DASH_RELEASE_FEED_URL: "{{RELEASE_FEED_URL}}"
      # manual = list what is available and wait for an admin to click.
      # stage/current auto-publish; a site opts into that deliberately.
      DASH_RELEASE_FEED_POLICY: "{{RELEASE_FEED_POLICY}}"
      # Admin "Users" section (create editor accounts, approve devices,
      # set known passwords). Leave TRUENAS_PW blank to disable that section
      # only -- everything else keeps working without it.
      TRUENAS_HOST: "{{NAS_HOST}}"
      TRUENAS_USER: "{{NAS_USER}}"
      TRUENAS_PW: "REPLACE_ME"
      # Which runtime NAS backend the dashboard builds
      # (ccsync_dashboard.nas.factory): "truenas" or "synology".
      DASH_NAS_KIND: "{{NAS_KIND}}"
      # The backend-neutral names the dashboard's settings PREFER (DASH_NAS_*
      # wins over TRUENAS_*). Same values as the trio above; both are set so a
      # rollback to a pre-2026-08-17 image still finds credentials, and so a
      # Synology site does not have to spell its password TRUENAS_PW.
      DASH_NAS_HOST: "{{NAS_HOST}}"
      DASH_NAS_USER: "{{NAS_USER}}"
      DASH_NAS_PW: "REPLACE_ME"
      # The Synology backend does over SSH what DSM has no API for: writing an
      # editor's ~/.ssh/authorized_keys. An UNSET hostkey means trust-on-first-
      # use, and the dashboard warns on every connect -- that channel carries
      # the NAS admin password, so pin it (site.toml [nas] ssh_hostkey, from
      # `ssh-keyscan -t ed25519 <nas>`).
      DASH_NAS_SSH_PORT: "{{NAS_SSH_PORT}}"
      DASH_NAS_SSH_HOSTKEY: "{{NAS_SSH_HOSTKEY}}"
      # "0" stops the admin Users page opening an SSH session per render to
      # ask which editors have a key installed.
      DASH_NAS_SSH_KEY_PROBE: "{{NAS_SSH_KEY_PROBE}}"
      # Where the NAS puts editor homes (site.toml [tree] homes_parent); the
      # dashboard creates accounts under it. Was a literal in the client
      # until 2026-08-17.
      DASH_NAS_HOMES_PARENT: "{{NAS_HOMES_PARENT}}"
      # The stack's own NAS account (site.toml [stack] owner); hidden from the
      # Users page (2026-08-17).
      DASH_NAS_SERVICE_USER: "{{NAS_SERVICE_USER}}"
      # A SCOPED TrueNAS API key, preferred over the password above and the
      # reason the password no longer has to be in this container at all
      # (2026-08-17, COMMERCIAL_READINESS.md item 6 / finding H3: `docker
      # inspect` on this container handed over a root-equivalent NAS login,
      # and every editor can reach the dashboard). Mint one with
      # `python server/create_api_key.py --name ccsync-dashboard`; it is
      # restricted to the user/group/sharing.smb methods the admin Users page
      # calls. TrueNAS only -- DSM has no API-key concept, so a Synology stack
      # leaves this empty and keeps using DASH_NAS_PW.
      TRUENAS_API_KEY: "${TRUENAS_API_KEY:-}"
      DASH_NAS_API_KEY: "${TRUENAS_API_KEY:-}"
      # TLS verification for those TrueNAS API calls (they carry the API key
      # or TRUENAS_PW). "0" = trust the NAS's self-signed cert, as before. Set
      # "1", or a CA bundle path inside the container (docs/SERVER.md,
      # "Verifying the NAS certificate"), once the NAS has a trusted cert.
      TRUENAS_VERIFY_SSL: "0"
      # --- what GET /api/v1/site serves ------------------------------------
      # The facts a client needs BEFORE it has any credentials: the companion
      # reads smb_unc into server_p_unc instead of deriving it, both installers
      # fetch nas_syncthing_id, and the wizard builds its rclone remote from
      # the four SFTP values. Every one of them comes from site.toml, and a
      # blank means "this deployment has not been told" -- never another
      # tenant's value (COMMERCIAL_READINESS item 10).
      #
      # Two are load-bearing rather than cosmetic:
      #   SFTP_CHUNK_SIZE  255Ki on TrueNAS; "64Ki" on Synology, where DSM
      #                    7.2's OpenSSH 8.2 TRUNCATES a lane-B download at
      #                    539,000,832 bytes and rclone calls it a size
      #                    mismatch (synology-spikes-2026-08-17 spike 6).
      #   SFTP_SHELL_TYPE  "unix" on TrueNAS; "none" on Synology, whose
      #                    editors are /sbin/nologin, so rclone cannot run
      #                    md5sum over SSH and every checksum fails.
      DASH_SITE_ORG_NAME: "{{SITE_ORG_NAME}}"
      # The short form for the topbar mark, and the PRODUCT's name (not the
      # customer's -- a reseller sets that one). Blank means "use org_name" /
      # "CC Sync"; the dashboard applies those defaults, so a blank must reach
      # it as a blank (2026-08-17, COMMERCIAL_READINESS.md item 10).
      DASH_SITE_ORG_SHORT: "{{SITE_ORG_SHORT}}"
      DASH_SITE_PRODUCT_NAME: "{{SITE_PRODUCT_NAME}}"
      # The CUSTOMER'S LOGO for the companion's tray and window title
      # (2026-08-18). Item 10 de-branded the tray to a neutral product mark
      # and left $CCSYNC_BRAND_LOGO -- a per-MACHINE env var -- as the only
      # way back, so an existing fleet lost its logo on upgrade and could not
      # get it back without touching every editor. Blank still means "wear the
      # product mark", so a site that says nothing is unchanged.
      DASH_SITE_BRAND_LOGO: "{{SITE_BRAND_LOGO}}"
      DASH_SITE_TREE_NAME: "{{SITE_TREE_NAME}}"
      # The project template and the fleet-wide asset libraries, comma-joined
      # (item 11). The container has no site.toml, so this pair is how the
      # dashboard's "create new project" flow builds the SAME tree
      # server/setup_tree.py does. Blank = the product defaults, never an
      # empty list -- that would create projects with no subfolders at all.
      DASH_SITE_TEMPLATE_FOLDERS: "{{SITE_TEMPLATE_FOLDERS}}"
      DASH_SITE_SHARED_ASSETS: "{{SITE_SHARED_ASSETS}}"
      # Single-quoted: these two carry backslashes (P:\ and a UNC path), and a
      # backslash in a DOUBLE-quoted YAML scalar is an escape character.
      DASH_SITE_CANONICAL_PREFIX: '{{SITE_CANONICAL_PREFIX}}'
      DASH_SITE_REMOTE_ROOT: "{{SITE_REMOTE_ROOT}}"
      DASH_SITE_SMB_UNC: '{{SITE_SMB_UNC}}'
      DASH_SITE_SFTP_HOST: "{{SITE_SFTP_HOST}}"
      DASH_SITE_SFTP_PORT: "{{SITE_SFTP_PORT}}"
      DASH_SITE_SFTP_CHUNK_SIZE: "{{SITE_SFTP_CHUNK_SIZE}}"
      DASH_SITE_SFTP_CONCURRENCY: "{{SITE_SFTP_CONCURRENCY}}"
      DASH_SITE_SFTP_SHELL_TYPE: "{{SITE_SFTP_SHELL_TYPE}}"
      DASH_SITE_RCLONE_REMOTE: "{{SITE_RCLONE_REMOTE}}"
      # A FALLBACK only: the dashboard prefers Syncthing's live myID, so a
      # blank here is fine and a stale one cannot win.
      DASH_SITE_NAS_SYNCTHING_ID: "{{SITE_NAS_SYNCTHING_ID}}"
      DASH_SITE_DASHBOARD_URL: "{{SITE_DASHBOARD_URL}}"
    ports:
      # Bind only the interfaces the fleet actually uses (LAN for the base
      # rig, tailnet for remote editors) rather than 0.0.0.0 -- if the NAS
      # ever gains another interface it must not silently expose the
      # dashboard there. True tailnet-only would also drop the LAN bind.
      #
      # The addresses come from the environment so a NAS DHCP change or a
      # tailnet IP rotation is a variable edit, not a hard outage: Docker
      # fails with "cannot assign requested address" and the app never starts
      # if a hardcoded IP no longer exists on the host. Set DASH_BIND_LAN /
      # DASH_BIND_TAILNET in the app's env (or a .env next to this file).
{{DASH_PORT_BINDS}}
    volumes:
      # ro: the container must never be able to modify its own code -- the
      # command: line executes /app/deploy/run.sh, so a writable /app plus
      # any write path into it is remote code execution in a container
      # holding TRUENAS_PW.
      - {{NAS_APPS_ROOT}}/app:/app:ro
      # The dependency venv, on its own volume and owned 3000:3000 mode 700.
      # It used to live at /data/venv, which was group `editors` and mode
      # 770 -- so any editor could swap the interpreter run.sh execs and get
      # code execution as the dashboard user, with TRUENAS_PW in the
      # environment (AUDIT C-2). Keep it OUT of /data.
      - {{NAS_APPS_ROOT}}/venv:/venv
      - {{NAS_APPS_ROOT}}/data:/data
      # rw so the /project-setup page can create new project folders (with
      # the standard template). Safe: the container runs as 3000:3001
      # (broll:editors) -- the same owner:group setup_tree.py chowns the
      # tree to, and setgid dirs keep the editors group on new folders.
      - {{NAS_TREE_ROOT}}/Projects:/projects:rw
      # This repo's broll/web tree (app/, static/, schema.sql, migrations/),
      # read-only, on PYTHONPATH via run.sh. Same posture as /app: code is
      # never writable by the process that runs it. Shipped there by
      # install_dashboard_app.py (BROLL_WEB_SRC overrides the source) -- if it
      # is empty, /broll is simply absent.
      - {{NAS_APPS_ROOT}}/broll-web:/broll-app:ro
      # b-roll's DATA_ROOT is the SHARED ARCHIVE ITSELF, not a private copy:
      # broll.db, posters/, sprites/ and the Downloads/<category>/Proxy/ tree
      # editors link against in Resolve. One set of media serves both the
      # search UI and the timelines -- a private copy would mean 54.7 GB twice.
      #
      # Sits beside Projects/ under Creators_Club, which is what makes it
      # reachable as P:\Assets\B-roll Archive on an editor's machine.
      - "{{NAS_TREE_ROOT}}/Assets/B-roll Archive:/broll-data:rw"
      # This repo's music/web tree (musicweb/, static/, schema.sql,
      # migrations/), read-only, on PYTHONPATH via run.sh -- same posture as
      # /app and /broll-app. Shipped there by install_dashboard_app.py
      # (MUSIC_WEB_SRC overrides the source); if it is empty, /music is simply
      # absent. NOTE the package inside is `musicweb`, not `app`: two top-level
      # packages called `app` on one PYTHONPATH would collide.
      - {{NAS_APPS_ROOT}}/music-web:/music-app:ro
      # The one WRITABLE music path: music.db (queued ingest writes `pending`
      # rows into it) and the ingest staging/ dir. Owned 3000:3000 mode 770,
      # like /data and for the same C-2 reason -- group 3000, NOT editors.
      - {{NAS_APPS_ROOT}}/music-data:/music-data:rw
      # Read-only artefacts, shipped separately from the code because together
      # they are ~1.4 GB and change on the base rig's schedule, not the
      # dashboard's (install_dashboard_app.py --music-data):
      #   music-encoder  the exported CLAP text tower, ~482 MB. WITHOUT IT
      #                  /music/api/search 500s: the fallback is the full CLAP
      #                  model, which needs torch, which this container
      #                  deliberately does not have.
      #   music-proxies  one 128k mp3 per track, ~906 MB. Without them
      #                  /api/audio still works and streams the 60 MB
      #                  originals over Tailscale instead.
      - {{NAS_APPS_ROOT}}/music-encoder:/music-encoder:ro
      - {{NAS_APPS_ROOT}}/music-proxies:/music-proxies:ro
      # The music library itself -- P:\Assets\Music to an editor -- beside
      # Projects/ and the b-roll archive under Creators_Club. rw: queued
      # ingest moves each accepted upload into the share. Owned broll:editors
      # 2770 setgid like Projects/, NOT 770 group-3000, which would lock the
      # editors who browse this library out of it.
      - "{{NAS_TREE_ROOT}}/Assets/Music:/music-share:rw"
      # Static ffmpeg + ffprobe for /music's queued ingest (ffprobe proves an
      # upload is audio, ffmpeg transcodes .ogg); run.sh prepends this to PATH.
      # NOTHING BUILDS THIS IMAGE -- it is a stock pinned python:3.12.7-slim --
      # and the container runs unprivileged, so the binaries are provisioned
      # onto the host by install_dashboard_app.py and mounted in. An empty dir
      # here is a supported state: ingest answers 503 and says why.
      - {{NAS_APPS_ROOT}}/ffmpeg:/opt/ffmpeg:ro
      # This repo's ytdl/web tree (ytdlweb/, static/, schema.sql), read-only,
      # on PYTHONPATH via run.sh -- same posture as /app, /broll-app and
      # /music-app. Shipped there by install_dashboard_app.py (YTDL_WEB_SRC
      # overrides the source); if it is empty, /ytdl is simply absent. The
      # package inside is `ytdlweb`, not `app` and not `ytdl`.
      - {{NAS_APPS_ROOT}}/ytdl-web:/ytdl-app:ro
      # The one WRITABLE ytdl path: ytdl.db (jobs, manifests and the permanent
      # cross-project dedupe ledger) and the worker's scratch. Owned 3000:3000
      # mode 770, like /data and /music-data and for the same C-2 reason --
      # group 3000, NOT editors. The finished CLIPS do not live here: they are
      # written into /projects, which sync then distributes.
      - {{NAS_APPS_ROOT}}/ytdl-data:/ytdl-data:rw
      # Timeline Cards' code: the MulticamPipeline checkout shipped to the
      # host by install_dashboard_app.py (CARDS_SRC overrides the source),
      # read-only like every other code mount. An empty dir here is a
      # supported state -- /cards reports `absent` and nothing else changes.
      # Mounted in IMAGE MODE TOO, unlike the four above: the vendor image
      # cannot carry another repo's tree.
      - {{NAS_APPS_ROOT}}/cards-web:/cards-app:ro
      # NOTE: the VAULT (/vault:rw) and the FOOTAGE SHARE (/media:ro) are
      # NOT here, and that is deliberate -- they are a per-site pair like
      # the deno mount below, added by install_dashboard_app.py only when
      # site.toml's [timeline_cards] names them, together with
      # `group_add: ["<vault gid>"]` so this container's uid may write the
      # vault at all. docs/DOCKER.md, "The Timeline Cards mounts", has the
      # exact host recipe and the reason a chown is needed first.
      # NOTE (2026-08-17): two mounts used to follow and no longer do.
      # claude-home and claude-bin are gone with the CLI -- the AI calls use
      # the anthropic SDK with ANTHROPIC_API_KEY above, so there is no OAuth
      # credential volume and no agent binary inside a container that mounts
      # the whole Projects tree rw (COMMERCIAL_READINESS.md item 1).
      #
      # And `{{NAS_APPS_ROOT}}/deno:/opt/deno:ro` is added by
      # install_dashboard_app.py ONLY on a site whose site.toml sets
      # [features] youtube_unblock (item 3): deno's job here is answering
      # YouTube's "n challenge", which is an anti-anti-automation component
      # the vendor build does not ship. This default file therefore has no
      # deno mount and no `bgutil` service -- see the note where that service
      # used to be, below the healthcheck.
    restart: unless-stopped
    # Without this, `restart: unless-stopped` only covers a process that
    # EXITS. A collector thread that died before entering its guarded loop
    # (or a wedged event loop) leaves a container that answers nothing useful
    # forever. /api/v1/health is unauthenticated by design for exactly this.
    #
    # It reads the BODY, not the status code. api_health answers 200 on every
    # path (deliberately: ship.ps1's post-deploy version poll and the macOS
    # onboarding wizard's connection test both treat any non-200 as "the
    # dashboard is down"), so the dead-collector signal lives entirely in
    # `ok` -- which db.fetch_collector_status clears once the newest non-prune
    # poll run is older than COLLECTOR_STALE_SECONDS. A status-only probe
    # therefore could not see the one thing this healthcheck exists to catch
    # (DASH-2, 2026-08-14). Mirrored in server/install_dashboard_app.py's
    # healthcheck_config -- keep the two identical, character for character
    # (server/tests/test_safety.py asserts it).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:{{DASH_PORT}}/api/v1/health', timeout=5)).get('ok') else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # A CAP ON THIS CONTAINER'S STDOUT (ops-efficiency-7, 2026-08-21).
    # docker's json-file driver has NO cap of its own, and whether the host's
    # daemon.json sets one depends on the NAS vendor -- which is exactly the
    # thing this product stopped assuming. Every companion posts
    # /api/v1/report every 5 s while a lane syncs and every open dashboard tab
    # polls /partials/* every 2 s, so an appliance nobody logs into eats the
    # apps dataset (also snapshotted hourly) and makes `docker logs` useless
    # for the one time somebody needs it. run.sh drops uvicorn's access log
    # for the same reason; this is the floor under everything else.
    #
    # 100 MB total, five files, so a rotation still leaves the last few hours
    # of an incident to read. Kept in step with
    # install_dashboard_app.LOG_ROTATION, which is what the TrueNAS path
    # POSTs.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # yt-dlp's PO-token provider -- the one piece that makes YouTube extraction
  # work from this NAS at all. Measured against the live container on
  # 2026-08-11, all four states:
  #
  #   anonymous                 -> "Sign in to confirm you're not a bot"
  #   cookies alone             -> past the check, then NO FORMATS AT ALL
  #   cookies + PO token + EJS  -> works
  #
  # A datacentre IP doing bulk extraction gets bot-checked, so authenticated
  # is the only way in; and YouTube wants a GVS proof-of-origin token for
  # authenticated requests, which yt-dlp ships no provider for. This is one.
  #
  # A SIDECAR, not a process in the dashboard container: the provider is a JS
  # service, the dashboard image is a stock python:slim that builds nothing,
  # and the alternative (the plugin's script mode) spawns a JS runtime PER
  # CALL against a pipeline that makes hundreds of them.
  #
  # NO published ports on purpose: compose puts both services on one network
  # and the dashboard reaches this by service name, so nothing on the LAN or
  # tailnet can ask it for tokens.
  #
  # The tag is pinned and matched to the `bgutil-ytdlp-pot-provider` pin in
  # requirements-unblock.txt (NOT the base requirements.txt every deployment
  # installs -- 2026-08-17, COMMERCIAL_READINESS.md items 2/3) -- one
  # component, two processes. Bump both or neither.
  # The `-deno` flavour matches the runtime this fleet already provisions for
  # yt-dlp's JS challenges.
  # NOT IN THE DEFAULT STACK (2026-08-17, COMMERCIAL_READINESS.md item 3).
  # install_dashboard_app.py adds this service -- image
  # brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno, `restart:
  # unless-stopped`, no ports -- only when the customer's site.toml sets
  # [features] youtube_unblock. A proof-of-origin token minter exists for one
  # purpose, and that purpose is the customer's call to make, not the
  # vendor's. The image tag is still pinned and still matched to the
  # `bgutil-ytdlp-pot-provider` pin in requirements-unblock.txt (never the
  # base requirements.txt): one component, two processes, bump both or
  # neither.

  # --- OPTIONAL: Syncthing in this stack (profile "bundled-syncthing") -------
  #
  # Off unless asked for: `docker compose --profile bundled-syncthing up -d`.
  # A profiled service is inert otherwise -- compose neither creates nor
  # touches it -- which is what makes it safe to carry here while THIS site
  # keeps running Syncthing as a TrueNAS catalog app installed by
  # server/install_syncthing_app.py.
  #
  # It exists for the Synology port (SYNOLOGY_PORT_PLAN decision 3): DSM has no
  # Syncthing app we control, the SynoCommunity package versions on its own
  # schedule, and lane C is the fleet's least forgiving moving part. Running it
  # in our own stack means we pin the version, WE generate the API key, and the
  # /data mount matches DASH_SYNCTHING_DATA_PREFIX by construction.
  #
  # Pinned to a specific 1.x, like every other image here: an unpinned
  # syncthing/syncthing changes protocol behaviour and folder defaults
  # underneath a redeploy, and lane C is where that is expensive.
  syncthing:
    profiles: ["bundled-syncthing"]
    image: syncthing/syncthing:1.30.0
    # Same uid:gid as the dashboard -- everything Syncthing writes into the
    # tree must land owned by the service user and group-editors, exactly as
    # setup_tree.py chowns it.
    user: "{{APP_UID}}:{{APP_GID}}"
    environment:
      # WE generate this and hand the same value to the dashboard's
      # SYNCTHING_API_KEY, instead of fishing it out of the container's
      # config.xml after the fact (which is what the TrueNAS catalog app makes
      # you do). Required: an unset one leaves the GUI unauthenticated.
      STGUIAPIKEY: "${SYNCTHING_API_KEY:?set SYNCTHING_API_KEY}"
      # The GUI binds inside the container; the port mapping below is what
      # decides who can reach it.
      STGUIADDRESS: "0.0.0.0:8384"
    volumes:
      # The tree, at the same /data prefix setup_syncthing_folder.py builds
      # folder paths from. NOT the apps root: Syncthing's job is the tree.
      - {{NAS_TREE_ROOT}}:/data
      # Its own config + index database (device id lives here -- losing it
      # re-keys the device and every editor has to re-accept it).
      - {{NAS_APPS_ROOT}}/syncthing-config:/var/syncthing/config
    ports:
      # GUI on loopback ONLY. It is an unauthenticated-by-default admin
      # surface that can rewrite every folder in the fleet; reach it through
      # an SSH tunnel or the reverse proxy, never from the LAN.
      - "127.0.0.1:8384:8384"
      # Sync protocol (TCP + QUIC) and local discovery -- these DO need to be
      # reachable, or every editor falls back to relays.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
    # The same 100 MB stdout cap the dashboard service carries above, and for
    # the same reason (ops-efficiency-7, 2026-08-21): json-file has no default
    # limit and this stack may run for years on a NAS nobody logs into.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --- OPTIONAL: the Resolve Project Server (profile "project-server") -------
  #
  # Off unless asked for: `docker compose --profile project-server up -d`.
  # This site runs Postgres as its own TrueNAS app, administered separately,
  # and check_health.py only ever TCP-probes it -- so nothing here manages it.
  # The profile exists for a site that would rather have one stack.
  #
  # The host port is a variable because 5432 is frequently already taken on a
  # Synology (DSM's own PostgreSQL, Synology Drive, Note Station); publish it
  # elsewhere with DASH_PG_PORT and point Resolve at that. postgres:13 is what
  # DaVinci Resolve's project server expects -- do not "upgrade" it casually.
  postgres:
    profiles: ["project-server"]
    image: postgres:13
    environment:
      POSTGRES_USER: "postgres"
      # Resolve's default project-server password. Change it here AND in every
      # editor's Resolve database entry, or nobody can open a project.
      POSTGRES_PASSWORD: "${PG_PASSWORD:-DaVinci}"
    volumes:
      - {{NAS_APPS_ROOT}}/postgres:/var/lib/postgresql/data
    ports:
      - "${DASH_PG_PORT:-5432}:5432"
    restart: unless-stopped
    # The same 100 MB stdout cap the dashboard service carries above, and for
    # the same reason (ops-efficiency-7, 2026-08-21): json-file has no default
    # limit and this stack may run for years on a NAS nobody logs into.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
