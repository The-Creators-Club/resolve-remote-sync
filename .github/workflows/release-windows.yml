# Build the Windows companion on a runner -- COMMERCIAL_READINESS.md item 13,
# added 2026-08-17.
#
# MANUAL ONLY (workflow_dispatch). Releases are a decision, not a consequence of
# a push, and `tools\ship.cmd` is still THE ship for this fleet: gates, dashboard
# deploy, publish, make-current, local upgrade, drift check. This workflow does
# the middle of that -- version parity, tests, PyInstaller, manifest -- on clean
# hardware, and hands you the artifact.
#
# IT DOES NOT PUBLISH. Nothing here talks to a dashboard, a NAS or the fleet: a
# GitHub runner cannot reach the tailnet, and an upgrade channel that any push
# could write to would be a supply-chain hole rather than a convenience. The
# release key never enters GitHub either (docs/RELEASE_FEED.md section 5).
#
# WHAT PUBLISHES THIS ARTEFACT: `python tools/publish_latest.py`, on the base
# rig. It takes the newest green run of this workflow ON MAIN, re-verifies the
# sha256, refuses a commit that is not an ancestor of origin/main or a version
# older than the channel already carries, signs, and uploads to the vendor
# feed (docs/RELEASE.md). For the studio's own dashboard only, the old path
# still works: `installer\build_editor_package.ps1 -Publish -MakeCurrent`, or
# `tools\ship.cmd` as usual.
#
# SIGNING. Unsigned unless the secrets are present, and it says so in the run
# summary. The variable names are tools/release.ps1's own (item 4):
#   CCSYNC_SIGN_THUMBPRINT           SHA1 of a cert in CurrentUser\My -- what an
#                                    EV token presents, and NOT usable from a
#                                    hosted runner (the token is physical).
#   CCSYNC_SIGN_PFX_BASE64 + ..._PASSWORD
#                                    an OV .pfx, base64'd into a secret. This is
#                                    the one a hosted runner can actually use.
#   CCSYNC_SIGN_TIMESTAMP_URL        optional RFC3161 override. A timestamp is
#                                    not optional in substance: without one every
#                                    signature this build ever made goes invalid
#                                    the day the certificate expires.

name: release-windows

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Emergency valve: skip the companion suite (the release script runs it by default, CCSYNC_REQUIRE_RCLONE=1). Use when a suite-only failure must not block getting a build shipped -- the exe itself is unaffected either way."
        type: boolean
        default: false
      allow_dirty:
        description: "Allow a dirty tree (stamps the manifest +dirty)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # JOB-level, not step-level (installer-onboard-tools-2, 2026-08-21). A
    # step's own `env:` block is applied AFTER its `if:` is evaluated, so the
    # materialise step below guarded itself on a value that was always empty
    # and was therefore ALWAYS skipped -- CCSYNC_SIGN_PFX never reached
    # GITHUB_ENV, and the documented CI signing route (CCSYNC_SIGN_PFX_BASE64)
    # was dead on arrival while the run reported success and the manifest
    # honestly said signed_binary=false. The `secrets` context is not
    # available in a step `if` either, which is what the old comment was
    # working around; a job-level env is visible to both.
    env:
      PFX_B64: ${{ secrets.CCSYNC_SIGN_PFX_BASE64 }}
    steps:
      # Full history: release.ps1 stamps the manifest with the commit, and a
      # shallow checkout makes that describe the wrong thing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same step, same reason as ci.yml's windows job (2026-08-17): the
      # runner resolves `bash` to WSL's stub, whose UTF-16 stdout fails 37
      # companion tests at once and stops release.ps1 before PyInstaller.
      - name: put Git's bash ahead of WSL's on PATH
        run: "'C:\\Program Files\\Git\\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: companion/requirements.lock

      # release.ps1's Install-CompanionEditable creates companion\.venv and
      # installs `.[dev,tray]` itself, but it does NOT install PyInstaller --
      # on the base rig that has simply always been there. Do it first, from
      # the lock plus one pinned build tool.
      #
      # PyInstaller is deliberately NOT in requirements.lock: it is GPL-2.0
      # (with the bootloader exception) and it is a BUILD tool, not something
      # we convey. Keeping it out of the lock is what lets tools/check_licenses.py
      # stay strict about the frozen set. Pinned all the same -- an unpinned
      # freezer changes what lands in the exe.
      - name: prepare the companion venv
        run: |
          python -m venv companion/.venv
          companion/.venv/Scripts/python -m pip install --disable-pip-version-check --require-hashes -r companion/requirements.lock
          companion/.venv/Scripts/python -m pip install --disable-pip-version-check "pyinstaller==6.21.0"

      # release.ps1 runs the DASHBOARD suite too (its own parity gate), and it
      # locates an interpreter with Get-VenvPython -- which falls back to bare
      # `python` on PATH when dashboard/.venv is absent, and a hosted runner's
      # python has no pytest. That is why every release-windows run since the
      # workflow was added (2026-08-17) died with "No module named pytest"
      # AFTER a clean 3736-test companion pass, having built nothing. The
      # macOS workflow never hit it: release_macos.sh does not run this suite.
      #
      # From the lock, --require-hashes, same as the companion venv above:
      # pytest is already in dashboard/requirements.lock, so this needs no
      # extra pin of its own.
      - name: prepare the dashboard venv (release.ps1 runs its suite too)
        run: |
          python -m venv dashboard/.venv
          dashboard/.venv/Scripts/python -m pip install --disable-pip-version-check --require-hashes -r dashboard/requirements.lock

      # release.ps1 runs the companion suite with CCSYNC_REQUIRE_RCLONE=1 (its
      # own comment: "pytest exits 0 when tests SKIP, so a missing rclone would
      # silently drop 24 lane-direction tests from a release"), which turns a
      # missing binary from a skip into a hard failure -- and a bare
      # windows-latest runner has no rclone at all. Same pin
      # installer/windows_bootstrap.ps1 ships to every editor
      # ($RcloneVersion/$RcloneZipSha256), verified before extraction, same as
      # the installer does, so the release build's own test run exercises the
      # exact binary the fleet gets.
      - name: install pinned rclone (the companion suite requires a real binary)
        shell: pwsh
        run: |
          $version = "v1.75.0"
          $sha256  = "203581f0a7baeae873f2347483a798c79e2eaf5c384a4e9d866aa374f1c89ac0"
          # TWO SOURCES, ONE CHECKSUM (2026-08-29). downloads.rclone.org went
          # down mid-afternoon and took every CI run AND both release builds
          # with it, before a single test had run: four red runs about
          # somebody else's web server. The GitHub release carries the
          # byte-identical asset (verified: same sha256), so it is tried
          # second. The pin is still the trust anchor - a mirror that serves
          # different bytes fails exactly as loudly as a corrupt download.
          $asset   = "rclone-$version-windows-amd64.zip"
          $urls    = @(
            "https://downloads.rclone.org/$version/$asset",
            "https://github.com/rclone/rclone/releases/download/$version/$asset"
          )
          $zip     = Join-Path $env:RUNNER_TEMP "rclone.zip"
          $ok = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300 -ErrorAction Stop
              $ok = $true
              break
            } catch {
              Write-Host "rclone: $url unreachable ($($_.Exception.Message)) -- trying the next source"
            }
          }
          if (-not $ok) { throw "could not download rclone from any source" }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            throw "rclone download hash mismatch: expected $sha256, got $actual"
          }
          $extractDir = Join-Path $env:RUNNER_TEMP "rclone-extract"
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          New-Item -ItemType Directory -Force -Path companion/.tools | Out-Null
          $exe = Get-ChildItem -Path $extractDir -Filter "rclone.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "could not find rclone.exe inside the downloaded zip" }
          Copy-Item $exe.FullName "companion/.tools/rclone.exe" -Force

      # No `if:` at all any more: the emptiness test is INSIDE the body, where
      # the value is certain to be visible (installer-onboard-tools-2,
      # 2026-08-21). A step that skips itself on a condition it cannot read is
      # indistinguishable in the run summary from one that had nothing to do,
      # which is how a whole signing route stayed dead. Either way this prints
      # what it decided into the run summary.
      - name: materialise the signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            "signing: no CCSYNC_SIGN_PFX_BASE64 secret -- this build will be UNSIGNED unless CCSYNC_SIGN_THUMBPRINT resolves (it cannot on a hosted runner: no cert store, no token)" |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          # Written under RUNNER_TEMP, never into the workspace: the workspace
          # is what gets uploaded as an artifact.
          $pfx = Join-Path $env:RUNNER_TEMP "ccsync-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          "CCSYNC_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "signing: certificate materialised from CCSYNC_SIGN_PFX_BASE64 -- signtool will be attempted" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: build
        shell: pwsh
        env:
          CCSYNC_SIGN_THUMBPRINT: ${{ secrets.CCSYNC_SIGN_THUMBPRINT }}
          CCSYNC_SIGN_PFX_PASSWORD: ${{ secrets.CCSYNC_SIGN_PFX_PASSWORD }}
          CCSYNC_SIGN_TIMESTAMP_URL: ${{ secrets.CCSYNC_SIGN_TIMESTAMP_URL }}
        run: |
          $args = @()
          if ("${{ inputs.skip_tests }}" -eq "true")  { $args += "-SkipTests" }
          if ("${{ inputs.allow_dirty }}" -eq "true") { $args += "-AllowDirty" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/release.ps1 @args

      # The onboarding wizard (onboard.exe) is a second PyInstaller artefact
      # that BUNDLES the companion exe just built (onboarding/build_onboard.spec
      # refuses to run without it), so it has to come after, from the same
      # venv. Same shape as release-macos.yml's wizard step (2026-08-17): a
      # failed wizard build must not throw away a companion build that
      # succeeded -- it is reported and the companion artefact still uploads.
      # It is SIGNED and it carries its OWN MANIFEST (installer-onboard-tools-1
      # and release-pipeline-4, 2026-08-21). Before that: nothing in the repo
      # ever ran signtool on this exe, so the artefact a fresh install
      # double-clicks shipped unsigned even with a certificate configured; and
      # with no ccsync-onboard.json beside it, tools/publish_latest.py could
      # not publish the installer to the vendor feed at all, so a feed-only
      # customer's [ INSTALLER ] page was empty and their admin was told to
      # run a vendor-internal PowerShell script.
      - name: build the onboarding wizard (onboard.exe)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CCSYNC_SIGN_THUMBPRINT: ${{ secrets.CCSYNC_SIGN_THUMBPRINT }}
          CCSYNC_SIGN_PFX_PASSWORD: ${{ secrets.CCSYNC_SIGN_PFX_PASSWORD }}
          CCSYNC_SIGN_TIMESTAMP_URL: ${{ secrets.CCSYNC_SIGN_TIMESTAMP_URL }}
        run: |
          if (-not (Test-Path "companion/dist/ccsync-companion.exe")) {
            "no companion exe -- skipping onboard.exe" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          Push-Location onboarding
          try {
            & ../companion/.venv/Scripts/python.exe -m PyInstaller build_onboard.spec --noconfirm 2>&1 | ForEach-Object { "    $_" }
            if ($LASTEXITCODE -ne 0) {
              "onboard.exe build FAILED (PyInstaller exit $LASTEXITCODE) -- companion artefact is still good" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 0
            }
          } finally { Pop-Location }
          # The same shared signtool call site tools/release.ps1 and
          # installer/build_editor_package.ps1 use. A no-op when no identity
          # is configured; a hard failure only when signtool ran and failed,
          # and even then the companion artefact still uploads.
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/sign_windows_binary.ps1 -Path onboarding/dist/onboard.exe
          if ($LASTEXITCODE -ne 0) {
            "onboard.exe SIGNING FAILED -- the installer artefact is unsigned" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $testsRun = $false
          if ("${{ inputs.skip_tests }}" -ne "true") {
            Push-Location onboarding
            try {
              & ../companion/.venv/Scripts/python.exe -m pytest tests -q
              $testsRun = ($LASTEXITCODE -eq 0)
            } finally { Pop-Location }
            if (-not $testsRun) {
              "onboarding suite FAILED -- the manifest will say tests_run=false, and publish_feed.py will refuse it without --allow-untested" |
                Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          $v = (Select-String -Path onboarding/steps.py -Pattern '^INSTALLER_VERSION\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $exe = Get-Item onboarding/dist/onboard.exe
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $signed = ((Get-AuthenticodeSignature -LiteralPath $exe.FullName).Status -eq "Valid")
          # tools/release.ps1's manifest shape, for the onboard artefact:
          # publish_latest.py reads exactly these keys (version, platform,
          # artifact, sha256, size_bytes, git_dirty, tests_run,
          # signed_binary) and refuses a build whose bytes do not match.
          # git_dirty is read from the checkout the same way release.ps1 does.
          $dirty = [bool](git status --porcelain)
          $manifest = [ordered]@{
            version       = $v
            platform      = "windows"
            artifact      = "onboard.exe"
            sha256        = $h
            size_bytes    = $exe.Length
            built_at      = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            git_commit    = "$(git rev-parse HEAD)".Trim()
            git_dirty     = $dirty
            # The ONBOARDING suite, run below against the tree this exe was
            # built from. publish_feed.py refuses a manifest that says false
            # (OPS-1), and it must never say true on trust.
            tests_run     = $testsRun
            signed_binary = $signed
            built_by      = "github-actions/release-windows"
            built_with    = ".github/workflows/release-windows.yml"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText((Join-Path (Get-Location) "onboarding/dist/ccsync-onboard.json"), ($manifest | ConvertTo-Json), $utf8NoBom)
          "onboard.exe built: installer $v, sha256 $h, $($exe.Length) bytes, authenticode=$signed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: report what was produced
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $manifest = "companion/dist/ccsync-release.json"
          if (Test-Path $manifest) {
            Get-Content $manifest | Out-String | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "no manifest at $manifest -- the build did not complete" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: upload the build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccsync-companion-windows
          path: |
            companion/dist/ccsync-companion.exe
            companion/dist/ccsync-release.json
            onboarding/dist/onboard.exe
            onboarding/dist/ccsync-onboard.json
          if-no-files-found: error
