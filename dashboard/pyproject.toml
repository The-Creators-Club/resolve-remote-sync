[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsync-dashboard"
version = "0.1.0"
description = "Creators Club Sync fleet dashboard: per-project, per-editor sync status served off the NAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "requests>=2.31",
    "smbprotocol>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
ccsync-dashboard = "ccsync_dashboard.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
