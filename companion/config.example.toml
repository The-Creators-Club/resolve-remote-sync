# ccsync-companion config: an example with every value filled in.
#
# This file is a REFERENCE, not what you get on first run. Three things can
# produce ~/.ccsync/config.toml, and they differ:
#   1. installer/windows_bootstrap.ps1 or macos_bootstrap.sh, which seeds it
#      with the values it already knows (editor_name, local_root, remote,
#      remote_root). This is the normal path and the one to prefer.
#   2. the companion itself, if no config exists when it starts. It writes
#      ccsync_companion/config.py: DEFAULT_TOML_TEXT, which leaves the
#      install-specific values BLANK on purpose.
#   3. copying this file by hand and editing it.
#
# In cases 2 and 3 the companion logs a specific complaint per missing value
# at startup (config.py: validate_config) rather than silently doing nothing.
# Restart the companion after editing.

# Your name/handle, used to build the "B-roll/Editor Added/<editor_name>"
# destination suggested by the popup fixer.
editor_name = "editor-1"

# Absolute path to this machine's local copy of the project tree.
#   Windows: "C:\\Creators_Club"
#   macOS:   "/Users/<you>/Creators_Club"
local_root = "C:\\Creators_Club"

# The canonical shared-drive prefix used in Resolve's stored clip paths
# (Windows: the "P:" virtual drive letter from SPEC.md's Path canon). Used
# to detect BAD_PREFIX (mapping-health) situations: a clip path that starts
# with this prefix but doesn't resolve under local_root.
canonical_prefix = "P:\\"

# OPTIONAL override for the tray's "Grade from server originals" P: swap.
# By default the server tree's SMB path comes from the dashboard's site
# manifest (GET /api/v1/site -> smb_unc); failing that it is derived: host
# from dashboard_url below, share path from remote_root's part after the
# pool/volume component (TrueNAS shares datasets under their own names,
# Synology's shared folder is the first component under /volumeN). So the
# feature works on every install with no extra setup. Set an explicit UNC
# here, e.g. "\\\\<nas-host>\\<share>\\<tree>", to override both, or "off" to
# hide the feature on this machine. Syncing is unaffected either way (the
# lanes use local_root directly).
# server_p_unc = ""

# Name of the rclone remote pointing at the NAS. Must match a stanza in
# rclone.conf. The bootstrap installers name it after the dashboard's site
# manifest (GET /api/v1/site -> rclone_remote) and fall back to "ccsync_sftp"
# when the dashboard publishes no name -- so this value is whatever your
# admin's site says, and "ccsync_sftp" on a stock install. ccsync-companion
# does not configure rclone remotes for you.
remote = "ccsync_sftp"

# ABSOLUTE path on the NAS under which project trees live.
#
# This MUST be absolute. An SFTP session starts in your home directory on the
# NAS (/mnt/<pool>/<share>/homes/<you>), so a relative value like
# "Creators_Club" resolves to ~/Creators_Club (a path that doesn't exist),
# and lane A would upload into your home directory instead of the shared
# tree, with no error to show for it. TrueNAS: /mnt/<pool>/<share>/<tree>;
# Synology: /volume1/<share>/<tree>.
remote_root = "/mnt/<pool>/<share>/Creators_Club"

# NEITHER OF THESE SCOPES WHAT SYNCS, and neither does the whole tree.
# With dashboard_url set (the default), the DASHBOARD decides: only the
# projects you have TICKED there sync to this machine, and the sequencer
# works through them ONE AT A TIME. Lanes A and B are not whole-tree
# mirrors. Names with spaces are fine.
#
# `projects` pairs positionally with `syncthing_folder_ids` for lane C's
# folder-ID check, and nothing else.
projects = [
    "Projects/2025/FF4/Nuclear",
    "Projects/2026/Creator Profiles/Season 1",
]
# Only the destination the popup fixer suggests for media added from outside
# the tree. Blank means it suggests the tree root instead.
active_project = "Projects/2026/Creator Profiles/Season 1"

# Resolve timeline poll interval, in seconds.
poll_interval = 3

# Lane A (video originals, up) periodic full-pass interval, in seconds.
scan_interval_up = 300

# Lane B (proxies, down) periodic full-pass interval, in seconds.
scan_interval_down = 120

# Lane B stability gate: don't download a proxy whose mtime is newer than
# this. The Blackmagic Proxy Generator writes each proxy at its FINAL name
# and grows it in place for minutes, so without this lane B ships truncated
# proxies once per pass and sweeps each superseded partial into
# .ccsync-trash. 0 disables the gate.
lane_b_min_age_seconds = 120

# -- lane B circuit breaker + .ccsync-trash retention (item 9, 2026-08-17) --
# rclone's --max-delete 100 / --max-delete-size 20G bounds ONE lane B pass.
# These bound the SEQUENCE: past any of them lane B STOPS on this machine
# (lanes A and C keep running) until someone uses the tray's "Resume proxy
# download". Nothing is ever deleted -- removals become moves into
# .ccsync-trash -- so a trip costs visibility, never footage.
#   lane_b_max_deletes_per_pass     how many files one pass may trash
#   lane_b_max_delete_fraction      ...or this share of the local proxy set,
#                                   whichever is smaller (small projects)
#   lane_b_remote_shrink_fraction   trip when the NAS listing shrinks past
#                                   this share of what it held last pass
# lane_b_max_deletes_per_pass = 50
# lane_b_max_delete_fraction = 0.25
# lane_b_remote_shrink_fraction = 0.5
#
# How long recovery copies are kept in <local_root>/.ccsync-trash, and how
# big that directory may get before the OLDEST batches are dropped. The
# newest batch is never pruned by the size rule, and NOTHING is pruned while
# the breaker above is tripped. 0 disables the age rule / the size cap.
# trash_max_age_days = 14
# trash_max_bytes = 53687091200
# trash_prune_interval_seconds = 21600

# Lane A watchdog file-stability debounce, in seconds.
watch_debounce_seconds = 10

# rclone --transfers (parallel stream count).
transfers = 4

# --- transport tuning ------------------------------------------------------
# The values shown ARE the defaults; every one is safe to leave alone. Set a
# string to "" or an int to 0 to drop that rclone flag entirely.

# In-flight SFTP window = sftp_chunk_size x sftp_concurrency. rclone's SFTP
# backend has no multi-thread upload, so a single large original rides ONE
# SSH stream and this window / round-trip-time is its hard speed ceiling.
sftp_chunk_size = "255Ki"
sftp_concurrency = 64
# Parallel SSH connections rclone may open to the NAS.
sftp_connections = 16
# Parallel same-or-different checks while comparing the two sides.
checkers = 16
# true skips rclone's post-transfer hash check, which otherwise makes the NAS
# re-read (md5sum) every file it just received or sent -- the single largest
# source of NAS I/O contention between editors.
rclone_ignore_checksum = true
# Transfer order: uploads newest-first (today's card ingest lands first),
# downloads smallest-first. "" for rclone's own ordering.
order_by_up = "modtime,descending"
order_by_down = "size,ascending"
# Run lane A (up) and lane B (down) at the same time. They are opposite
# directions on a full-duplex link, so serializing them leaves one idle for
# the whole of the other's run.
concurrent_lanes = true
# Re-clone the server's empty directory structure only every Nth pass -- it
# is redundant once the structure exists. 0 = never re-clone.
structure_clone_every_n_passes = 10
# "none" leaves every selected Syncthing folder unpaused, so lane C runs
# continuously alongside A/B. "rotate" is the older pause-all-but-current
# scheme: many more Syncthing config commits, a full rescan on every
# unpause, and a project's small files can wait a whole rotation.
lane_c_pause_scheme = "none"
lane_c_max_folder_concurrency = 2
# Report (never delete) orphaned "<name>.partial" files left on the NAS by
# killed uploads, every Nth pass. 0 = never scan.
orphan_scan_every_n_passes = 20
# Upload a newly-added clip as soon as it settles instead of waiting for the
# sequencer to rotate round to its project (which took minutes at best, a
# whole pass at worst). Upload-only, so it runs alongside the periodic pass.
express_upload_enabled = true
# Window over which watchdog events are batched before the express run.
# Defaults to watch_debounce_seconds, which managed mode otherwise ignores.
express_debounce_seconds = 10.0
# Paths per window. A bigger burst -- a card ingest -- is left to the
# periodic pass rather than shipped as one enormous express run.
express_max_batch = 200

# Local Syncthing REST API base URL and API key. Leave syncthing_api_key
# empty to read it from Syncthing's own config.xml -- first from the
# installer-managed Syncthing home (%LOCALAPPDATA%\ccsync\syncthing-config
# on Windows, ~/.local/ccsync/syncthing-config on macOS), falling back to
# the stock per-OS Syncthing path for hand-rolled setups (see
# ccsync_companion/sync/syncthing_lane.py: default_config_xml_path).
syncthing_url = "http://127.0.0.1:8384"
syncthing_api_key = ""

# Expected Syncthing folder ID per project (same order/length as `projects`
# above). Leave as [] to skip the folder-id verification.
syncthing_folder_ids = []

# Restart the sync engine when it dies (SYNC-17, 2026-08-18). Nothing else on
# an editor machine does: the autostart entry runs at LOGON and never again,
# so a session that ends leaves Syncthing dead while the companion, rclone and
# the tray all come back -- lane C then carries nothing until the next logon.
# Commented out because true IS the shipped value; set it false only to take
# the engine's lifetime into your own hands. Nothing is restarted while
# syncing is halted or paused, and lane C reports the error either way.
# supervise_syncthing = true

# Path to the rclone binary. Defaults to "rclone" (must be on PATH). The
# bootstrap installer is responsible for getting rclone onto PATH, not this
# app; if missing, the sync lanes report a clear error status.
rclone_path = "rclone"

# Log file (rotating). Console logging is always on in addition to this.
log_path = "~/.ccsync/companion.log"
log_level = "INFO"

# Crash reports (2026-08-17).
#
# A JSON file per unhandled exception is ALWAYS written to ~/.ccsync/crashes/:
# traceback, version, platform, and the last 200 lines of companion.log at the
# moment it happened. That last part is why it exists -- the log rotates at
# 5 MB, and by the time anyone asks, the lines that explain the failure are
# usually gone. It is written owner-only, secrets in it are redacted, at most
# 20 are kept, and it is never sent anywhere.
#
# The two keys below switch on the OPTIONAL network sender, and BOTH are
# required: there is no vendor endpoint compiled into this app, so
# `crash_reporting = true` with an empty crash_dsn still sends nothing at all.
# The sender also needs the `sentry_sdk` package, which the frozen build
# deliberately does not ship -- so this is a source-install / self-built
# feature for a customer who wants it. See docs/legal/TELEMETRY.md.
crash_reporting = false
crash_dsn = ""

# Dashboard reporter: periodically POSTs lane statuses to a server-side
# dashboard so an admin can see editor health without remoting in. There is
# NO default (2026-08-17): the installer writes your admin's URL here --
# remote editors get the tailnet address, a machine on the same LAN can use
# the LAN one. Blank disables reporting, managed sync and the tray's "Open
# dashboard" link entirely -- the reporter thread isn't even started.
# dashboard_token is sent as the X-CCSync-Token header; ask the admin for it.
dashboard_url = "http://<your-dashboard-host>:8480"
# WHO MAY DRIVE THE LOOPBACK API on 127.0.0.1:8899 -- the "Send to Resolve"
# and "Download here" buttons on the b-roll, music and YouTube pages
# (2026-08-17, COMMERCIAL_READINESS.md item 5). Since then only the dashboard's
# own origin may, and dashboard_url above IS that origin, so neither of these
# is normally needed. They are escape hatches, deliberately absent from the
# defaults, and the companion names the first one when it refuses a page:
#
#   loopback_extra_origins  additional EXACT origins, for a deployment whose
#                           editors browse the dashboard at a name
#                           dashboard_url does not use (a second tailnet name,
#                           a reverse proxy). Scheme + host + port, no path.
#   loopback_dev_origins    also accept http(s)://127.0.0.1|localhost:* -- for
#                           a developer running the dashboard on this machine.
# loopback_extra_origins = ["https://nas.example.ts.net"]
# loopback_dev_origins = false
dashboard_token = ""
# YOUR OWN fleet token, if your admin has minted one (dashboard -> Admin ->
# Users -> REPORT TOKENS). Shaped "cce1.<id>.<secret>". It identifies your
# machines rather than the whole fleet, can be revoked for you alone, and
# outranks the shared dashboard_token above wherever both are set -- a tray
# sign-in never overwrites it. Blank = use the shared token.
report_token = ""
# Login gate: when true, the companion will not start sync lanes/the
# sequencer, nor report under an identity, until the editor signs in via the
# tray ("Sign in...") with their TrueNAS username+password and the dashboard
# verifies it. The watcher, popup fixer, and tray still run pre-sign-in so
# there's a way to sign in. Set false to trust editor_name above instead.
require_login = true
dashboard_report_interval = 60
# Faster report cadence used while any sync lane is actively syncing, so the
# dashboard's live transfer progress feels responsive. The heavier
# local_manifest/media_tree payload sections still only go out at most every
# dashboard_report_interval seconds even on these fast ticks.
dashboard_report_interval_active = 5
# How often the local disk media manifest (originals/proxies rollup, per
# clip counts+bytes) is rescanned, on its own background thread.
manifest_refresh_interval = 300
# How often the Resolve media-pool BIN tree is rescanned for dashboard
# reporting, on its own background thread.
media_tree_refresh_interval = 120

# Managed mode (active only when dashboard_url above is set): the dashboard
# decides WHICH projects this editor has and in what order (GET
# {dashboard_url}/api/v1/selection/{editor_name}), and a sequencer syncs
# them ONE AT A TIME. Only ticked projects sync; the tree is never
# replicated as a whole. How often the sequencer re-fetches that selection:
selection_poll_interval = 60
# How long (seconds) the sequencer waits for a project's Lane C
# (Syncthing) sync to settle before moving on to the next project anyway.
# LOAD-BEARING ONLY under lane_c_pause_scheme = "rotate", where the next
# project's turn pauses this folder and the wait is what stops that happening
# mid-transfer. Under the default scheme ("none") nothing is paused and
# Syncthing paces every folder itself, so the full wait gates nothing and is
# capped by lane_c_settle_seconds below (ops-efficiency-3, CR-62):
project_rotation_seconds = 600
# The lane C wait under the default pause scheme. A project's turn gives up
# after this many seconds instead of parking the whole sequencer -- and lane B
# proxies for every project behind it -- for the full project_rotation_seconds
# on any folder with a large backlog or a permanently non-zero need (a
# conflict, a deleted-but-still-ticked remote). It is kept above zero so the
# dashboard's current_project reads sensibly rather than flickering through
# the queue. 0 restores the old behaviour (wait the full rotation either way),
# and this is ignored entirely under lane_c_pause_scheme = "rotate":
lane_c_settle_seconds = 30
# How long (seconds) the sequencer idles between full passes once every
# selected project is caught up (small edits still trickle during this
# window -- every selected folder is unpaused while idle):
sequencer_idle_seconds = 60
# How long (seconds) the last selection response is served from memory before
# the companion asks the dashboard again. The sequencer consults the selection
# from a 5-second poll loop, so this is what keeps that from becoming ~120
# requests (and disk writes) per project per pass:
selection_fetch_ttl = 30
# Longer TTL for the sticky per-Resolve-project destination mapping
# (project_roots) carried in the same response -- it changes only when an
# admin re-maps a project root:
project_roots_ttl = 300

# Set false on the base rig (direct LAN access to the NAS): it reads proxies
# straight off the share, so lane B's local proxy mirror is pure waste.
# COMMENTED OUT, deliberately -- see sync_enabled directly below for why.
# lane_b_enabled = true

# Repoint a clip's PROXY at the copy in the tree when the project's stored
# proxy path is stale or was never linked. A project built on another machine
# carries that machine's absolute proxy paths (a temp transfer drive, a local
# render folder, the base rig's legacy mapping); those exist on no editor's
# machine, and an explicit stale path beats the adjacent-Proxy auto-link, so
# the clip reads Media Offline next to a perfectly good proxy. Only ever
# repoints -- never copies, moves or deletes.
proxy_relink_enabled = true

# Say when clips in your projects have no proxy. Lane B is the only path that
# carries video DOWN to the other machines, and it only carries Proxy folders
# -- so an original with no Proxy/<name>.mov or .mp4 beside it is invisible to
# every editor but you, and nothing used to say so. Reporting only; no file is
# read, written or moved by this. Independent of the generator below: a
# machine with no ffmpeg still tells you which clips the fleet cannot see.
proxy_notify_enabled = true

# Make the missing proxies here, with ffmpeg, while you are away from the
# machine. THREE-STATE, and COMMENTED OUT ON PURPOSE: with no value it is
# derived from lane_b_enabled -- on where lane B is off (the base rig, whose
# local_root IS the NAS tree, so a proxy made there fans out to everyone), off
# where lane B is on (every editor). That is not a taste call. Lane B is
# `rclone sync`, the one verb that DELETES local files: a proxy generated on
# an editor's machine for a project that syncs exists nowhere on the NAS, so
# the next lane-B pass files it into .ccsync-trash and the encode was for
# nothing. Uncomment to generate anyway -- proxies for projects lane B never
# touches do survive -- or set false to be sure a machine never encodes.
# proxy_gen_enabled = true

# The ffmpeg binary. The companion does not ship it (it would double the size
# of every upgrade), but with local YouTube downloads on it installs a pinned
# static ffmpeg+ffprobe beside yt-dlp on first run (2026-08-16), and the
# default name below finds that copy when nothing on PATH answers. Give an
# absolute path to use your own install instead; the companion never touches
# that one. With neither, proxy generation stays notifier-only -- that is a
# config choice, never a fault, and syncing is unaffected.
ffmpeg_path = "ffmpeg"

# How often (seconds) the tree is walked looking for originals with no proxy.
# This is a SECOND full walk on top of the media manifest's, hence a quarter
# hour rather than anything eager -- the tray's "make them now" forces one.
proxy_scan_interval = 900

# How long (seconds) the keyboard and mouse must have been still before
# encoding starts. It stops the instant you come back, mid-clip, and leaves no
# part-file behind. ONLY encoding waits for this -- the scan and the notice
# never do. A machine that cannot tell whether you are idle encodes nothing at
# all: a missing proxy beats ffmpeg running under your hands.
proxy_gen_idle_seconds = 300

# Skip a file whose mtime is newer than this (seconds) -- it is still being
# copied off a card or written by a render. Same settle window, for the same
# reason, as lane_b_min_age_seconds above.
proxy_gen_min_age_seconds = 120

# The rest of the generator's knobs. The values shown ARE the defaults and are
# commented out for the same reason as the transport tuning above: an explicit
# value copied into a real config pins it, so a later re-tune reaches nobody.
# Height ceiling, never an upscale -- a 720p original stays 720p.
# proxy_gen_max_height = 1080
# Bitrate for the HEVC 10-bit proxies, chosen to match the Resolve-generated
# proxies the fleet already carries. Anything that isn't a number optionally
# followed by K or M is logged and ignored.
# proxy_gen_bitrate = "7M"
# Attempts on one file before it is left alone for the rest of the session.
# Never remembered across restarts -- a blacklist on disk would turn a
# transient GPU failure into a permanent one.
# proxy_gen_max_failures = 3
# Free space kept clear on the volume the proxies are written to, whichever of
# the two is larger. Proxies land next to their originals -- the same volume
# every sync lane and Resolve's own cache share -- so filling it stalls far
# more than proxy generation. 0 disables the check.
# proxy_gen_free_space_floor_gb = 20
# proxy_gen_free_space_floor_pct = 5
# Seconds between the two (size, mtime) samples that decide a source has
# stopped growing. rclone and every card copier set the mtime when they CREATE
# a file, so a transfer in flight can look settled while its size is still
# climbing -- and ffmpeg would then make a proxy of half an interview. The
# scan's own sample usually supplies the first one, so this is rarely waited
# out. 0 = one sample (the pre-2026-08-17 behaviour; not recommended).
# proxy_gen_stability_seconds = 5
# Rehearsal: report every clip that WOULD be encoded and encode nothing.
# proxy_dry_run = false
# Rehearsal for FIX ALL: report what would be copied and where each clip would
# be relinked, and copy/relink nothing. Read once at startup, so restart the
# tray after changing it. See docs/RESOLVE_EDIT_SAFETY.md.
# fixer_dry_run = false
# How long (seconds) before the same "clips have no proxy" notice may appear
# again. A day, so a restart doesn't re-nag about a gap you already know about.
# proxy_notify_cooldown_seconds = 86400
# Stand down completely while Resolve is running. Off by default: the idle
# gate already covers a Resolve you are sitting in front of. Turn it on if you
# leave UNATTENDED renders going, which idleness cannot see (an unattended
# render looks exactly like being away from the machine).
# proxy_gen_skip_while_resolve_running = false

# -- b-roll ingest ----------------------------------------------------------
# Drag clips onto the dashboard's b-roll page and THIS machine indexes them:
# ffmpeg makes the proxy, sprite, poster and the frames, a local Qwen3-VL
# describes them, and rclone puts the results in the archive on the NAS. It
# claims nothing until somebody drops something, so leaving it on costs a
# machine that never ingests exactly nothing.
# broll_ingest_enabled = true
# Seconds away from the keyboard before an "only when idle" batch may crunch.
# A batch run in FOREGROUND mode ignores this and the Resolve gate below.
# broll_ingest_idle_seconds = 300
# Stand down while Resolve is open. ON here, unlike the proxy generator's
# equivalent: indexing wants 4-12 GB of VRAM for the local model, which is
# what the timeline you left open is using.
# broll_ingest_skip_while_resolve = true
# Free space kept clear where clips are staged (staging is inside the tree).
# broll_ingest_free_space_floor_gb = 20
# ffmpeg children one batch may run at once. The describe stage owns the GPU;
# a wider encode beside it just makes both slower.
# broll_ingest_max_concurrent_ffmpeg = 2
# Where clips are staged. "" = inside the archive
# (<local_root>\Assets\B-roll Archive\.ingest). THE BASE RIG NEEDS THIS SET:
# its local_root is the NAS share, so staging there sends every original over
# SMB twice.
# broll_ingest_staging_dir = ''

# BRAW / R3D / CRM -- the clips ffmpeg cannot decode at any quality. They are
# counted and reported but never queued for ffmpeg, because promising a proxy
# this machine cannot make is worse than reporting the gap. The Blackmagic
# Proxy Generator can make them, so the companion starts it -- but only once
# the ffmpeg queue is EMPTY (BPG is DaVinci Resolve with -pg, i.e. the same
# GPU; two encoders at once is the thing this sequencing exists to avoid) and
# only while you are away. It is never stopped by us: our own ffmpeg encodes
# are safe to kill because they write <stem>.mp4.partial and are renamed into
# place only when complete, and BPG's write behaviour is its own -- so a
# started BPG is left to finish what it began.
#
# Default is derived, like proxy_gen_enabled: on wherever this machine already
# generates proxies AND has Resolve installed, which is the base rig.
# bpg_enabled = true
# Where Resolve lives, if it is not at the standard install path. BPG is not a
# separate binary -- this exe is launched with -pg.
# bpg_path = 'C:\Program Files\Blackmagic Design\DaVinci Resolve\Resolve.exe'

# BPG takes no file list: it watches the FOLDERS in its own settings
# (%APPDATA%\Blackmagic Design\Blackmagic Proxy Generator), and it does not
# start its own queue -- its window opens Idle with a Start button. Left to
# itself that means a generator can be up, your BRAW sitting at "Waiting", and
# nothing encoding: the base rig ran exactly like that for months (2026-08-13).
# So the companion adds the folders holding those clips to the watch list and
# presses Start once the window is up.
#
# The watch list is only ever ADDED to -- an entry you added is never removed
# or rewritten, an ancestor you already watch is left to cover it, and the file
# is backed up once (.ccsync-backup) before the first change. Start is only
# ever pressed when the button reads "Start"; nothing here ever presses Stop.
#
# Worth knowing before you turn these on for a folder full of finished work:
# BPG proxies EVERY unproxied clip in a folder it watches, and it does not
# recognise this companion's Proxy\<stem>.mp4 -- only its own .mov. So a folder
# with 6 BRAW gaps and 173 clips the companion already proxied gets all 179
# encoded again.
bpg_manage_watch_folders = true
bpg_autostart = true
# "" = %APPDATA%\Blackmagic Design\... . Only for a BPG that keeps its settings
# somewhere else; nothing in the fleet needs this.
# bpg_settings_path = ''

# Import clips downloaded by the dashboard's YouTube page into the project you
# have open, under Master > Youtube > <search term>. They land on this machine
# in <project>\Youtube\<term>\ like any other synced media, and the companion
# files them into matching bins so you do not have to go looking for the
# folder. Only ever ADDS media pool items: nothing on disk is moved, renamed
# or deleted, and a clip already anywhere in the pool -- including a bin you
# moved it to yourself -- is never imported a second time. Only the project
# currently OPEN in Resolve is touched; anything that arrived for another
# project is imported when you open that one.
youtube_import_enabled = true
# How often (seconds) that folder is re-listed while the project is open. A
# listing of one directory per search term, not a tree walk.
youtube_import_scan_interval = 60
# Skip a file whose mtime is newer than this (seconds), or whose size changed
# since the last look: it is still arriving, and half a video imports as an
# offline clip. Same settle window as proxy_gen_min_age_seconds above.
youtube_import_min_age_seconds = 120
# How many files are handed to Resolve in one go, per term folder, per cycle;
# the rest follow on the next cycle. This is what stops a large drop from
# holding the Resolve scripting lock (and with it the tray) for a long time.
# youtube_import_batch_limit = 20
# Attempts on one file before it is left alone for the rest of the session.
# Never remembered across restarts -- and Resolve being closed, or you having
# switched to another project, is not an attempt.
# youtube_import_max_failures = 3

# Download the YouTube clips you asked for on THIS machine rather than having
# the server download them and sync them down to you. Two reasons it is the
# default: your own connection is the one YouTube is least hostile to (the NAS
# fetches for the whole fleet from one static IP, and has already been rate
# limited for it), and the clips appear in your tree immediately instead of
# after a NAS download plus a sync hop. Set false to leave every download to
# the server -- worth doing on a metered or tethered connection. Everything
# else about the YouTube page is identical either way, and any clip that fails
# here is retried on the server before the job closes.
ytdl_local_downloads = true
# Which yt-dlp does the downloading. "" = the companion installs and maintains
# its own under %LOCALAPPDATA%\ccsync\tools (macOS: ~/Library/Application
# Support/ccsync/tools), checking it at startup and once a day and letting
# `yt-dlp -U` update it. That is deliberate rather than bundling yt-dlp into
# the companion: YouTube breaks it every few weeks, and waiting for a companion
# release to fix downloading is how a machine spends a month unable to
# download. Set an absolute path to a yt-dlp you manage yourself and the
# companion only READS its version -- it will never install over it, and never
# run -U against it.
ytdlp_path = ""

# A cookies.txt exported from a signed-in YouTube session (Netscape format).
# Set this and YOUR downloads use it: it is what passes YouTube's bot check
# and unlocks age-restricted clips on this machine, rather than handing those
# jobs to the server. Leave it "" for anonymous downloads (public clips work
# fine; age-gated ones fall back to the server). Easiest way to fill it is the
# tray's "Sign in to YouTube (for downloads)…", which validates a cookies.txt
# and saves it to ~/.ccsync/youtube-cookies.txt (used automatically when this
# is blank). Export from a Firefox/Chrome "cookies.txt" extension in a PRIVATE
# window, signed in to the account you want, and don't browse YouTube in that
# window afterwards or the session rotates and the file goes stale. The
# companion also installs a static ffmpeg + a deno JS runtime beside yt-dlp
# for this -- both are required for signed-in downloads and neither is
# bundled; nothing to configure.
ytdl_cookies_file = ""

# How many pieces of a YouTube clip to fetch at once when THIS machine does the
# download (yt-dlp -N). YouTube serves these downloads as HLS fragments, and one
# at a time runs at whatever pace one connection gets: measured 3-4 MB/s on a
# long clip against 50+ MB/s with six in flight. 1 is the old one-at-a-time
# fetch; the companion keeps the value between 1 and 16.
ytdl_fragment_jobs = 6

# The shared LUT library. LUTs sync to <local_root>/Assets/Luts like any other
# asset, but Resolve only reads the LUT directories it has been told about --
# so the companion adds the library to Resolve's own supported list
# (Preferences > System > General > LUT Locations). Nothing on disk is moved,
# renamed or linked, and Resolve's factory LUTs are untouched. The preference
# can only be written while Resolve is QUIT (it rewrites its own preferences
# on exit), so a first run with Resolve open takes effect once it is closed.
lut_sync_enabled = true
# Resolve's OWN LUT folder -- where "Open LUT Folder" drops a LUT, and so
# where the tray finds LUTs that are on this machine only and offers to share
# them. Blank = the standard location for this platform.
resolve_lut_dir = ""
# The exact string written into the LUT Locations list. Blank = the canonical
# P:\Assets\Luts on Windows -- identical on every editor's machine, which is
# what keeps an applied LUT resolvable everywhere -- and the real local path
# on macOS, which has no P: drive.
lut_location_override = ""
# How often the LUT Locations entry and the stray-LUT scan are re-checked.
lut_check_interval = 900
# Resolve scans its LUT locations ONCE, at startup. Open it before P: has
# finished mapping and the shared library is missing for that whole session --
# while the preference above still reads perfectly, so nothing else here can
# see it. The symptom is "LUTs missing" plus a "Failed to read Shaper LUT" per
# rendered frame in Resolve's log (2026-08-11). The companion spots
# that in the log and re-scans the list in place, with no restart and no
# preference edit -- the one LUT fix that works while an editor is mid-edit.
lut_index_repair_enabled = true
# Resolve's own log file, which is where that startup miss is visible.
# Blank = the standard location for this platform.
resolve_log_override = ""

# The shared Resolve gallery. Resolve derives the gallery directory from a
# media storage entry -- by default each machine's own scratch disk, which is
# different everywhere -- and machines sharing a project database are expected
# to agree, so they get "the stills location is not the same" at launch. This
# gives every machine a media storage entry for the synced <local_root>/Assets/
# Stills (with a Mapped Mount on macOS, so the database still sees P:\) and
# points the gallery at it. Media storage entry 1 is never touched: it is the
# scratch disk and render caching points at it. Only writable while Resolve is
# QUIT. Set false to leave the gallery exactly where it is.
stills_sync_enabled = true

# Warn on the Windows shutdown/restart/log-off screen while a sync is still
# in flight, naming how much is left, so nobody switches off mid-upload
# without knowing. The editor always keeps a "Shut down anyway" button --
# this never actually prevents a shutdown. Files are never lost, but rclone
# cannot resume an SFTP upload, so whatever was part-way through starts
# again from the beginning. Does not cover sleep.
shutdown_warning_enabled = true

# Keep the machine from idling into sleep while a sync is still running --
# sleep never triggers the shutdown warning above, and an overnight upload
# is likelier to die that way than to be switched off deliberately. Holds
# the SYSTEM idle timer only, so the screen still blanks on schedule, and
# only for as long as something is actually transferring. It cannot stop a
# deliberate Start -> Sleep or a closing laptop lid; nothing in user space
# can. Set false to let the machine sleep regardless.
#
# "Actually transferring" is enforced, not assumed (see shutdown_guard.py):
# a lane whose backlog has not changed for a few minutes, or that has no
# connected peer at all, is treated as stalled -- so a NAS that went away
# overnight can no longer hold this machine awake, or interrupt every
# shutdown, with nothing in flight.
keep_awake_while_syncing = true

# The two numbers behind that sentence. They bound BOTH guards above (the
# shutdown warning and the keep-awake), because a lane reports "syncing"
# from a NEED COUNT, not from bytes arriving.
#
# keep_awake_stale_seconds: how long a lane may report the SAME backlog --
#   no change in state, queued count, byte counters or last sync -- before it
#   counts as stalled rather than transferring. Lower it on a machine where a
#   dropped link should stop mattering sooner; raise it if a genuinely slow
#   single-file transfer (counters ticking rarely) reads as stalled.
# keep_awake_max_hold_seconds: the backstop for a lane whose numbers churn
#   but never finish (rclone wedged in SFTP retries). After this much
#   CONTINUOUS blocking both guards stand down until things settle. Raise it
#   on a machine that really does upload for longer than this in one run.
#
# The values shown ARE the defaults (3 minutes and 8 hours). A bad value is
# logged as a config warning and the default is used -- it never stops
# syncing. COMMENTED OUT for the same reason as the transport tuning above:
# writing them into every config pins them, so a later re-tune of a
# measured-good default would never reach an existing install.
# keep_awake_stale_seconds = 180.0
# keep_awake_max_hold_seconds = 28800.0

# If the sync tree lives on an external SSD and the drive is unplugged while
# something was still uploading or downloading, the companion warns at once
# ("...was disconnected before syncing finished: 2 uploads still to go") and
# then repeats the reminder this often, in minutes, until the drive is back.
# 0 keeps the first warning and drops the repeats. What counts as "still to
# go" is the same liveness verdict the two guards above use, so a lane that
# was merely stuck (CR-91) does not earn a reminder every half hour. The
# value shown IS the default, commented out for the reason given above.
# drive_reminder_minutes = 30

# Set false when this machine works entirely off the NAS share and should
# never sync anything locally (base rig). Timeline watcher, popup fixer and
# dashboard reporting keep working; all sync lanes stay off.
#
# BOTH OF THESE ARE COMMENTED OUT ON PURPOSE. mode = "base" below applies a
# profile (MODE_PROFILES in config.py) that sets sync_enabled = false -- but
# an explicit key in the file ALWAYS wins, so writing "sync_enabled = true"
# here makes that profile dead. Anyone who copied this file and set
# mode = "base" got full sync lanes on a machine whose local_root IS the NAS
# share, which is the worst blast radius in the system (AUDIT_2 CORE-M5 /
# the S-7 twin). Uncomment only to deliberately override the profile.
# sync_enabled = true

# Set false to never show the media-outside-tree popup (base rig: raw media
# legitimately lives outside the tree there). Still logged either way.
popup_enabled = true

# How long (seconds) a dismissed-without-acting out-of-tree clip is snoozed
# before the passive watcher will pop it again.
popup_snooze_seconds = 300

# The recurring "DaVinci Resolve is running but isn't accepting scripting
# connections" warning, and how many seconds apart it repeats (it also waits
# one full interval before the FIRST one -- Resolve's script server takes a
# moment to come up after launch, and a dialog three seconds into every
# launch teaches editors to dismiss the one warning that matters).
#
# The only warning here that repeats, because it is the only failure the
# editor cannot see: Resolve sits there looking perfectly normal while
# everything CCSync does with it -- the out-of-tree popup, proxy attach,
# b-roll/music/YouTube inserts -- is silently dead, and Resolve never retries
# a script server that failed at launch. Set the flag false, or the interval
# to 0, to switch it off; the dialog's STOP WARNING ME button silences it
# until the link recovers.
resolve_scripting_warning = true
resolve_scripting_warning_interval = 300

# Restart the companion when the Resolve it was connected to exits, so its
# scripting link starts clean against the next one. Leave this on unless you
# are debugging the companion itself: fusionscript keeps process-global IPC
# state, and a stale client can wedge the NEXT Resolve session's scripting
# server for every client on the machine -- the exact state the warning above
# reports, and one that restarting Resolve alone provably cannot clear
# (2026-08-12).
bridge_auto_restart = true

# "Send to Resolve" in the b-roll web UI (/broll on the dashboard). The
# companion listens on 127.0.0.1:8899 for that button and drives Resolve's
# media pool with it. The standalone BRoll Companion that used to do this is
# retired: if one is still running on this machine, quit it and remove it
# from startup -- it holds port 8899 and this server then can't start (it
# says so in companion.log; nothing else is affected).
#
# Share -> local folder mappings still live in ~/.broll-companion.json, with
# one exception: the "broll" share itself defaults to
# <local_root>/Assets/B-roll Archive, so it needs no entry at all. The port
# is pinned on the web page's side too, so changing it here only switches
# the feature off.
broll_server_enabled = true
broll_server_port = 8899

# Machine role: "editor" (default -- full sync lanes) or "base" (the central
# machine working directly off the NAS: implies sync_enabled false unless set
# explicitly above; the out-of-tree popup stays on so stray media still gets
# fixed into the tree).
mode = "editor"

# Resolve project names (case-insensitive) the companion pretends not to
# see: never reported, never prompt "set this up on the server", and their
# clips never raise the out-of-tree popup. For scratch/utility projects --
# Resolve's default "Untitled Project" and the Blackmagic Proxy Generator's
# helper project.
#
# Each name also covers Resolve's numbered duplicates of it: "New Doc" here
# silences "New Doc 1", "New Doc 2" and "New Doc (3)" too (the Proxy
# Generator counts these up all day). A longer real project name that merely
# starts the same -- "New Doc Final" -- is NOT ignored.
ignored_resolve_projects = ["Untitled Project", "New Doc"]

# -- the project-library walk (docs/LIBRARY_WALK_PLAN.md, 2026-08-26) --------
#
# The companion enumerates the open timeline and the media pool by reading
# Resolve's PROJECT LIBRARY -- the PostgreSQL database on the NAS, or the
# SQLite Project.db of a disk library -- rather than walking clips through the
# scripting API. Measured on a 926-item multicam timeline: 11-14 s of API
# calls, during which every other scripting client on the machine queues,
# versus single-digit milliseconds of SELECTs that cost Resolve nothing. The
# library also sees INSIDE multicam and compound clips, which the API cannot.
#
# Read-only, always: nothing here ever writes to the library. Any failure
# (library unreachable, credentials wrong, a schema this build does not know)
# falls back to the API walk and says so once in the log, so false is only for
# forcing the old behaviour deliberately.
# library_walk = true

# Which library to read, for when Resolve's own answer is missing or wrong.
# Resolve 21.0.1 returns None from both GetCurrentDatabase() and
# GetDatabaseList(), so the companion normally identifies the library by
# mining Resolve's log -- and a machine whose log has rotated away, or whose
# library has moved since, has nothing to mine. A host alone is enough to go
# on. Blank everywhere = work it out.
#
# library_db_password is a SECRET and config.toml is owner-only for exactly
# that reason (it already carries report_token). Blank = Resolve's own default
# password, which is what the fleet's libraries use.
# library_db_host = ""
# library_db_port = 5432
# library_db_name = ""
# library_db_user = ""
# library_db_password = ""
