[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsync-dashboard"
# Kept in lockstep with ccsync_dashboard.__init__.VERSION -- release.ps1 and
# check_deploy_drift.ps1 read only __init__.py, so this drifted three releases
# behind unnoticed. test_hardening.test_dashboard_version_does_not_drift is
# the guard.
version = "0.7.35"
description = "CC Sync fleet dashboard: per-project, per-editor sync status served off the NAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "requests>=2.31",
    "smbprotocol>=1.13",
]

[project.optional-dependencies]
# Runtime deps of the b-roll web app (broll/web in this repo), which this
# container mounts in-process at /broll when DASH_BROLL_ENABLED=1.
# Not dependencies of ccsync_dashboard itself
# -- the package imports none of them -- but they must be installed in the
# deployed venv or the mount fails at import. deploy/requirements.txt carries
# them for that reason; test_deploy_requirements_match_pyproject_dependencies
# checks both directions against this list.
#
# `fastembed` is deliberately absent: optional in the b-roll app (semantic
# search degrades to keyword-only) and it downloads a ~100 MB model from
# Hugging Face on first use.
broll = [
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    # `segments.search_norm`, the word-segmented + script-normalised CJK blob.
    # Computed by the SERVER since 2026-08-18 (docs/BROLL_INGEST_PLAN.md §3.1):
    # dashboard b-roll ingest has no base rig behind it to run an embed pass
    # afterwards. Optional upstream and therefore silent when missing, which is
    # why they are pinned here -- a two-character CJK term is below trigram's
    # floor and unicode61 makes an unbroken CJK run one token, so a container
    # without them serves an archive nobody can search in Chinese.
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
]

# Runtime deps of the music web app (music/web), mounted in-process at /music
# on the same terms as b-roll above. `numpy` is shared with that group and is
# not repeated here.
#
# `torch` is deliberately absent, and that is the whole shape of this app: the
# container never embeds audio, only query text, so the heavy half stays on the
# base rig and the DB arrives precomputed.
#
# python-multipart is NOT optional. FastAPI raises at *import* time for the
# UploadFile parameter on /api/ingest, so without it the dashboard reports the
# music tree as "absent" -- indistinguishable from never having shipped it.
music = [
    "python-multipart>=0.0.9",
    # Runs the exported CLAP text-tower artefact that /music/api/search embeds
    # queries with. Without it the app falls back to the full CLAP model, which
    # needs torch -- so search 500s instead of degrading. 54 MB unpacked
    # against torch's 675 MB, which is the whole reason the artefact exists.
    "onnxruntime>=1.17",
]

# Runtime deps of the YouTube downloader app (ytdl/web), mounted in-process at
# /ytdl on the same terms as b-roll and music. ffmpeg is a static binary on
# PATH (/opt/ffmpeg, see deploy/run.sh) and the Claude CLI is a subprocess,
# not an import.
#
# They belong here rather than in [project.dependencies] for the same reason
# the other two groups do: ccsync_dashboard imports none of it, but the
# deployed venv must have it or the mount fails at import and the feature is
# silently absent. test_deploy_requirements_match_pyproject_dependencies
# checks both directions against deploy/requirements.txt.
ytdl = [
    # The two AI calls (search-term expansion, relevance filtering). Floor pin,
    # not exact: the SDK is backwards-compatible. It replaced the interactive
    # `claude` CLI on 2026-08-17 -- that was a BINARY the installer provisioned
    # onto the NAS, authenticated by one human's personal account, so it was
    # never a package here (docs/COMMERCIAL_READINESS.md item 1).
    "anthropic>=0.69",
    # Floor raised to 2026.8.19 on 2026-08-26 (CR-80): older releases have no
    # YouTube client left that serves this NAS -- SABR-only formats or a 403
    # on the media fetch. 2026.8.19 adds the `visionos` client.
    "yt-dlp>=2026.8.19",
]

# Runtime deps of the Timeline Cards page (multicam_pipeline/cards, imported
# out of the checkout shipped to <host-root>/cards-web and mounted read-only
# at /cards-app), mounted in-process at /cards on the same terms as the three
# above. ccsync_dashboard imports none of it either -- but `cards.py` does at
# mount time, and a missing one is a feature that reports itself absent.
#
# `a2wsgi` is the WSGI<->ASGI shim under that mount: Timeline Cards' page is a
# `BaseHTTPRequestHandler` with ~70 hand-dispatched routes and its own
# Range/gzip code, and the phase-3 decision was to keep them byte for byte
# rather than rewrite them as an APIRouter (docs/TIMELINE-CARDS-INTO-CCSYNC.md
# §3.2). Pure Python, no dependencies of its own, ~30 KB. Floor pin, not
# exact, like every other line here.
#
# NOTE what is NOT here: `psycopg2` (the project library reader is optional --
# without it the page serves what an agent pushes), and node + the Claude CLI,
# which the standalone image bundles and this one deliberately does not
# (decision 7.6: the three Claude features go through `ai_providers`).
cards = [
    "a2wsgi>=1.10",
    # The project-library route (2026-08-31): reads Resolve's PostgreSQL
    # straight and decodes its transcription blobs; without them the route
    # dies with a silent ModuleNotFoundError and the page can only show
    # what the agent pushes. NOTE this reverses the earlier "psycopg2 is
    # deliberately not here" -- the library route went live on this site.
    "psycopg2-binary>=2.9",
    "zstandard>=0.21",
    # The lane's search: Simplified/Traditional folding + pinyin matching.
    # Both degrade in SILENCE when absent (MulticamPipeline requirements.txt
    # tells the story).
    "zhconv>=1.4.3",
    "pypinyin>=0.53",
]

# The YouTube "unblock" plugin -- SEPARATE from `ytdl` above, and deliberately
# not part of it (2026-08-17, docs/COMMERCIAL_READINESS.md items 2/3, CI run
# 32041222871's licence gate). `bgutil-ytdlp-pot-provider` is GPLv3, and
# `youtube_unblock` is the customer-enabled, off-by-default half of the
# YouTube feature that exists to get past YouTube's anti-automation measures
# (docs/legal/YOUTUBE_FEATURE_NOTICE.md) -- so it must not ride along with
# `ytdl`'s base dependency set into every deployment, on or off. Mirrors
# `deploy/requirements.txt` / `deploy/requirements-unblock.txt`'s split;
# test_deploy_requirements_match_pyproject_dependencies in test_hardening.py
# checks both files against both groups.
#
# PINNED, and pinned TOGETHER with the sidecar image tag in
# server/install_dashboard_app.py: the provider plugin and the server it
# talks to are one component split across two processes, and the project
# ships them as a matched pair. A floor here would let pip drift the plugin
# past the image on any redeploy.
ytdl_unblock = [
    "bgutil-ytdlp-pot-provider==1.3.1",
]

# The SSH half of the Synology NAS backend (nas/synology.py). DSM exposes no
# API for ~/.ssh/authorized_keys, and a file written through FileStation is
# owned by the admin -- sshd's StrictModes then refuses the key while logging
# nothing (docs/synology-spikes-2026-08-17.md, spike 2). So a DSM site needs
# paramiko; a TrueNAS site must not.
#
# Deliberately NOT in [project.dependencies], and deliberately not in the
# `broll`/`music`/`ytdl` group list in test_hardening's requirements check:
# those groups are "things the container always mounts", this one is
# per-site. A DSM deployment adds paramiko to deploy/requirements.txt (and
# `synology` to that test's group tuple) at the same time.
#
# LGPL-2.1 -- it belongs in the NOTICE file when readiness item 1 gets done.
synology = [
    "paramiko>=3.4",
]

# DASH_AUTH_METHOD=oidc (COMMERCIAL_READINESS.md item 12, 2026-08-17). PyJWT
# rather than authlib: the only thing this dashboard needs from a JOSE library
# is "verify an id_token against a JWKS", PyJWT does exactly that
# (jwt.PyJWKClient) in ~90 KB, and authlib would bring a second OAuth client
# stack alongside the one in oidc.py. `cryptography` -- which does the actual
# RSA/EC verification -- is already installed here as a paramiko dependency.
#
# Installed on every site like paramiko, and for the same reason: one
# requirements file for one image, and run.sh only re-runs pip when its hash
# changes. A site that never sets DASH_AUTH_METHOD=oidc simply never imports it
# (oidc.verify_id_token imports lazily, so a container WITHOUT it reports one
# clear problem instead of failing to import the dashboard).
oidc = [
    "PyJWT>=2.8",
]

dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
ccsync-dashboard = "ccsync_dashboard.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
