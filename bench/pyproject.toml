[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccbench"
version = "0.1.0"
description = "Sync-transport benchmark harness for Creators Club remote-editor sync (rclone/robocopy/syncthing/iperf3)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ccbench = "ccbench.cli:main"

[tool.setuptools.packages.find]
include = ["ccbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
