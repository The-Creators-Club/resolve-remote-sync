# Build the macOS companion on a runner -- COMMERCIAL_READINESS.md item 13,
# added 2026-08-17. THIS IS THE ONE THAT CLOSES A REAL GAP.
#
# PyInstaller does not cross-compile, so `tools\ship.cmd` on the base rig
# publishes neither macOS artefact and prints an advisory instead. The
# consequence, in the field: Mac editors run a build from a previous fix pass
# and stay there until someone sits at a Mac. A hosted macos-latest runner IS
# that Mac, on demand, for free.
#
# MANUAL ONLY, and IT DOES NOT PUBLISH. `tools/release_macos.sh` is invoked
# WITHOUT --publish/--make-current: a runner cannot reach the tailnet, and an
# upgrade channel any workflow could write to would be a supply-chain hole
# rather than a convenience. Download the artefact, then publish from a machine
# on the tailnet:
#
#   ./tools/release_macos.sh --publish --make-current \
#       --dashboard-url <url> --admin-user <you>
#
# ...or upload the artefact through the dashboard's admin Packages page.
#
# SIGNING. The script currently AD-HOC signs (PyInstaller's default), which is
# what makes a macOS upgrade reset TCC permissions on every install. Developer
# ID signing + notarisation is COMMERCIAL_READINESS.md item 4; the secret name
# reserved for it is CCSYNC_APPLE_DEV_ID, exported here already so the workflow
# needs no edit when the script learns to use it. Nothing below assumes it is
# set: unset means an ad-hoc-signed build, exactly as today.

name: release-macos

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Emergency valve: skip the companion suite (the release script runs it by default, CCSYNC_REQUIRE_RCLONE=1). Use when a suite-only failure (e.g. a test fix mid-flight) must not block getting a build to Mac editors -- the exe/app itself is unaffected either way."
        type: boolean
        default: false
      allow_dirty:
        description: "Allow a dirty tree"
        type: boolean
        default: false

# bug-hunt-2026-09-03 server-tools-3: "CI builds, this rig signs" was policy,
# not permission. With no block here the job holds whatever the repo's default
# workflow permissions are, which on a legacy setting is read/write - enough
# for a careless step or a third-party action to cut a release with the ambient
# token. Nothing here writes: uploading an artifact needs no contents scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: companion/requirements.lock

      # The script creates companion/.venv and installs `.[dev,tray]` itself,
      # but not PyInstaller. Same pin and the same reasoning as
      # release-windows.yml: it is a GPL-2.0 BUILD tool, deliberately absent
      # from requirements.lock so tools/check_licenses.py can stay strict about
      # what is actually frozen.
      - name: prepare the companion venv
        run: |
          python -m venv companion/.venv
          companion/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r companion/requirements.lock
          companion/.venv/bin/python -m pip install --disable-pip-version-check "pyinstaller==6.21.0"

      # This script sets CCSYNC_REQUIRE_RCLONE=1 before running the suite (see
      # its own comment: pytest exits 0 when tests SKIP, so a missing rclone
      # would silently drop 24 lane-direction tests from a release), which
      # turns "no rclone on this runner" from a skip into a hard failure --
      # exactly what happened on run 32036993646, the first time this workflow
      # ran (31 errors, "rclone not found. Searched: PATH,
      # companion/.tools/rclone, ~/.local/ccsync/bin/rclone"). Same pin
      # macos_bootstrap.sh ships to every editor Mac
      # (RCLONE_VERSION/RCLONE_SHA256_ARM64), verified before extraction, same
      # as the installer does. macos-latest is Apple Silicon, hence osx-arm64.
      - name: install pinned rclone (the companion suite requires a real binary)
        run: |
          set -euo pipefail
          version="v1.75.0"
          sha256="35e8f2a666ce789b29111db0dd843ddabc0d59c6b609d07bcaae5d1a07cba6f8"
          # TWO SOURCES, ONE CHECKSUM (2026-08-29). downloads.rclone.org went
          # down mid-afternoon and took every CI run AND both release builds
          # with it, before a single test had run: four red runs about
          # somebody else's web server. The GitHub release carries the
          # byte-identical asset (verified: same sha256), so it is tried
          # second. The pin is still the trust anchor - a mirror that serves
          # different bytes fails exactly as loudly as a corrupt download.
          asset="rclone-$version-osx-arm64.zip"
          zip="$RUNNER_TEMP/rclone.zip"
          ok=""
          for url in "https://downloads.rclone.org/$version/$asset"                      "https://github.com/rclone/rclone/releases/download/$version/$asset"; do
            if curl -fsSL --connect-timeout 20 --max-time 300 "$url" -o "$zip"; then
              ok="yes"
              break
            fi
            echo "rclone: $url unreachable -- trying the next source" >&2
          done
          if [ -z "$ok" ]; then
            echo "could not download rclone from any source" >&2
            exit 1
          fi
          actual="$(shasum -a 256 "$zip" | awk '{print $1}')"
          if [ "$actual" != "$sha256" ]; then
            echo "rclone download hash mismatch: expected $sha256, got $actual" >&2
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/rclone-extract"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q -o "$zip" -d "$extract_dir"
          found="$(find "$extract_dir" -name rclone -type f | head -n 1)"
          if [ -z "$found" ]; then
            echo "could not find rclone binary inside the downloaded zip" >&2
            exit 1
          fi
          mkdir -p companion/.tools
          cp "$found" companion/.tools/rclone
          chmod +x companion/.tools/rclone

      - name: build
        env:
          # Reserved for item 4. release_macos.sh ignores it today.
          CCSYNC_APPLE_DEV_ID: ${{ secrets.CCSYNC_APPLE_DEV_ID }}
        run: |
          set -eu
          args=""
          if [ "${{ inputs.skip_tests }}" = "true" ]; then args="$args --skip-tests"; fi
          if [ "${{ inputs.allow_dirty }}" = "true" ]; then args="$args --allow-dirty"; fi
          ./tools/release_macos.sh $args

      # The wizard is a separate artefact with its own script (installer >=
      # 1.0.17) and it has never been built on a Mac either. Best-effort: a
      # missing script must not fail a companion build that succeeded.
      #
      # It now writes its OWN MANIFEST beside the zip (release-pipeline-4,
      # 2026-08-21). Without one, tools/publish_latest.py had nothing to
      # verify or sign, so the macos kind=onboard channel could only ever move
      # when somebody sat at a Mac -- and a feed-only customer's Mac editors
      # had no wizard to download at all. Same key set as
      # companion/dist/ccsync-release.json, which is what publish_latest reads.
      - name: build the onboarding wizard
        if: ${{ !cancelled() }}
        run: |
          if [ ! -x ./tools/build_onboard_macos.sh ]; then
            echo "tools/build_onboard_macos.sh not present or not executable -- skipped"
            exit 0
          fi
          if ! ./tools/build_onboard_macos.sh; then
            echo "onboarding wizard build failed -- companion artefact is still good"
            exit 0
          fi
          version="$(sed -n 's/^INSTALLER_VERSION="\([^"]*\)".*/\1/p' installer/macos_bootstrap.sh | head -n 1)"
          zip="onboarding/dist/ccsync-onboard-macos-$version.zip"
          if [ ! -f "$zip" ]; then
            echo "no $zip -- not writing a manifest for something that is not there"
            exit 0
          fi
          sha="$(shasum -a 256 "$zip" | awk '{print $1}' | tr 'A-Z' 'a-z')"
          size="$(wc -c < "$zip" | tr -d ' ')"
          dirty=false
          if [ -n "$(git status --porcelain)" ]; then dirty=true; fi
          # tests_run is the ONBOARDING suite, run here, against the tree this
          # wizard was built from -- publish_feed.py refuses a manifest that
          # says false (OPS-1), and it must never say true on trust.
          tests=false
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            if (cd onboarding && ../companion/.venv/bin/python -m pytest tests -q); then
              tests=true
            else
              echo "onboarding suite FAILED -- the wizard manifest will say tests_run=false, and publish_feed.py will refuse it without --allow-untested"
            fi
          fi
          # printf, not a heredoc: a heredoc terminator cannot be indented
          # inside a YAML block scalar.
          printf '{"version":"%s","platform":"macos","artifact":"%s","sha256":"%s","size_bytes":%s,"built_at":"%s","git_commit":"%s","git_dirty":%s,"tests_run":%s,"signed_binary":false,"built_by":"github-actions/release-macos","built_with":".github/workflows/release-macos.yml"}\n' \
            "$version" "$(basename "$zip")" "$sha" "$size" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(git rev-parse HEAD)" "$dirty" "$tests" \
            > onboarding/dist/ccsync-onboard.json
          echo "wizard manifest written: $version, sha256 $sha, tests_run=$tests"

      - name: upload the build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccsync-companion-macos
          # Both shapes: the script's own dist/ output and whatever the wizard
          # produced. if-no-files-found: error, because "the Mac build ran and
          # produced nothing" is the exact failure this workflow exists to stop
          # going unnoticed.
          path: |
            companion/dist/**
            onboarding/dist/**
          if-no-files-found: error
