# Allowlist for tools/check_licenses.py -- COMMERCIAL_READINESS.md item 13,
# 2026-08-17.
#
# THE GATE IS THE POINT, NOT THIS FILE. Every entry here is a copyleft or
# unknown-licence package in something we CONVEY (the frozen companion, the
# dashboard container). The default answer is "replace it or stop shipping it";
# an entry is a decision that we ship it a specific way that is compliant, and
# `reason` is where that way is written down. An LGPL/GPL/AGPL/SSPL entry with
# no `reason` FAILS the gate exactly as if it were absent -- an allowlist whose
# entries do not say why is a mute button.
#
# The long-form analysis lives in docs/legal/THIRD_PARTY_NOTICES.md (generated
# by tools/gen_notices.py). This file is the short, machine-checked half; keep
# the two in agreement, and when they disagree the notices file is the one a
# lawyer read.
#
# Keys are PEP 503 normalised names (lowercase, runs of -_. collapsed to -).
#
#   license        what the metadata says, copied here so a silent upstream
#                  relicence shows up as a mismatch in review.
#   reason         REQUIRED for copyleft: how we ship it compliantly.
#   targets        optional; limits the entry to one of check_licenses.TARGETS.
#                  Omit to allow it everywhere it appears.
#   expect_removed optional; the entry is temporary and the plan is to delete
#                  the dependency. Reports as XFAIL rather than ALLOWED, and
#                  deleting the entry is what makes the gate fail again -- so
#                  the gate cleans itself up the day the dependency goes.

# [allow.pystray] WAS HERE, and its removal on 2026-08-17 is the mechanism
# working as designed. pystray (LGPLv3, statically linked into the single-file
# PyInstaller freeze) was the ranked stop-ship in item 3; the tray is
# ccsync_companion/tray_native.py now -- ctypes on Windows, PyObjC on macOS --
# and pystray is gone from companion/pyproject.toml and from
# companion/requirements.lock. With no entry here, the gate FAILS if it ever
# comes back, which is exactly what an allowlist is for.
# tools/tests/test_check_licenses.py pins that.

[allow.paramiko]
license = "LGPL-2.1"
targets = ["dashboard-container"]
reason = """\
LGPL-2.1, and the LGPL's dynamic-linking allowance is genuinely satisfied \
here rather than argued into place: paramiko is pip-installed as an ordinary \
importable package into the container's /venv (or an image layer built from \
the same requirements.lock), nothing is statically linked, and the customer \
can replace the installed copy with their own build without touching our code. \
It is imported only by ccsync_dashboard.nas.synology, on a DSM site, for the \
one thing DSM has no API for (writing ~/.ssh/authorized_keys). Obligations \
still owed and tracked in docs/legal/THIRD_PARTY_NOTICES.md: the notice, the \
licence text, and a written offer for the source of the version we install."""

# psycopg2-binary arrived in dashboard/deploy/requirements.lock on 2026-08-31
# for the mounted Timeline Cards page's project-library route, and the gate
# could not see its licence until 2026-09-11: dashboard/requirements.lock was
# compiled without pyproject.toml's `cards` extra, so no venv CI scans had the
# package and --strict reported it UNSCANNED rather than LGPL. The lock now
# carries the extra, which is what makes this entry necessary -- the gate
# working, a release late.
#
# The posture is paramiko's above, line for line: an ordinary pip-installed
# importable package in the container's /venv (or an image layer built from
# the same lock), nothing statically linked, replaceable by the customer's own
# build without touching our code. psycopg2 additionally carries its own
# LINKING EXCEPTION (its metadata says "LGPL with exceptions"), which is more
# permissive than plain LGPL, not less.
#
# `companion` joined the targets on 2026-09-25 (LG-11, decision D6 in
# docs/LEGAL_GAP_FEATURES_PLAN.md): the Timeline Cards role imports the
# MulticamPipeline engine into the frozen companion, and that engine reads
# Resolve's project library through psycopg2. It had been in pyproject.toml
# and build.spec since 2026-08-31 but not in companion/requirements.lock, so
# this gate could not see it and feed builds did not contain it. The pg8000
# alternative was rejected (it binds and types differently inside Resolve's
# own database); the posture in the frozen binary is the one counsel cleared
# in THIRD_PARTY_NOTICES, restated in `reason`. tools/scan_frozen.py reads
# `targets` too: without `companion` here, every companion build fails.
[allow.psycopg2-binary]
license = "GNU Library or Lesser General Public License (LGPL)"
targets = ["dashboard-container", "companion"]
reason = """\
LGPL with psycopg2's own linking exception. In the dashboard container it is \
shipped exactly the way paramiko above is and for the same reasons: \
pip-installed as an ordinary importable package into the container's /venv \
(or an image layer built from the same requirements.lock), nothing \
statically linked, and the customer can replace the installed copy with \
their own build without touching our code; it is imported only by the \
mounted Timeline Cards page's project-library route, and only on a site that \
sets DASH_CARDS_ENABLED. In the companion (since 2026-09-25, LG-11) it is \
frozen by PyInstaller as SEPARATE files, the psycopg2 extension module and \
the libpq and OpenSSL shared libraries its wheel carries, which are \
extracted to a temporary directory at run time and loaded from there as \
separate, replaceable shared-library files rather than code linked into \
ours. Their code is not changed; on macOS PyInstaller does rewrite each \
collected library's load commands (install names) and re-sign it, so there \
the files are not byte-identical to the wheel's (flagged for counsel against \
THIRD_PARTY_NOTICES' "unmodified", 2026-09-25 review round). It is used \
only by the Timeline Cards role. Both are covered by \
psycopg2's own linking exception as well. Obligations, met in \
docs/legal/THIRD_PARTY_NOTICES.md and in the licence texts every binary \
carries (tools/gen_notices.py --write-texts): the notice, the licence text, \
and a written offer for the source of the version we ship."""

# bgutil-ytdlp-pot-provider is GPLv3, and unlike paramiko above this is a
# CUSTOMER-ENABLED OPTIONAL FEATURE, not something every deployment carries
# (2026-08-17, docs/COMMERCIAL_READINESS.md items 2/3, CI run 32041222871).
# It exists for exactly one purpose -- minting the proof-of-origin token that
# gets a request past YouTube's anti-automation check -- so the vendor build
# does not convey it: it lives in dashboard/deploy/requirements-unblock.lock,
# a SEPARATE lock from the base dashboard-container target's, installed by
# run.sh into the container's venv only when a site's site.toml sets
# [features] youtube_unblock. `targets` below is what makes this excuse apply
# ONLY to the dashboard-container-unblock target -- if this package ever
# turns up in the BASE dashboard-container target (i.e. back in
# requirements.txt/.lock, conveyed to every customer regardless of the
# feature flag), it has no entry there and the gate fails, which is the
# point: this allowlist entry authorises shipping it ONLY behind the flag.
[allow.bgutil-ytdlp-pot-provider]
license = "GPL-3.0"
targets = ["dashboard-container-unblock"]
reason = """\
GPLv3, and conveyed only to a customer who set [features] youtube_unblock \
(off by default in the vendor build -- docs/COMMERCIAL_READINESS.md item 2/3, \
docs/legal/YOUTUBE_FEATURE_NOTICE.md). It is pip-installed as an ordinary \
importable package by dashboard/deploy/run.sh -- into the container's /venv \
in bind-mount mode, and into /data/unblock-site (on PYTHONPATH) in image \
mode, where /venv is read-only (CR-84) -- and never baked into \
dashboard/deploy/Dockerfile's image layer (see docs/DOCKER.md, 'What image \
mode does NOT bake in'), so \
the LGPL/GPL dynamic-linking-style posture paramiko relies on above applies \
here too: nothing is statically linked, and a customer who enabled the \
feature can replace the installed copy with their own build without \
touching our code. Obligations still owed and tracked in \
docs/legal/THIRD_PARTY_NOTICES.md: the notice, the licence text, and a \
written offer for the source of the version we install -- and, \
independently of licensing, docs/COMMERCIAL_READINESS.md item 2's legal \
review of the anti-anti-automation posture itself, which this allowlist \
entry does not settle."""
