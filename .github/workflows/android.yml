# Build the CC Sync Android app (a Trusted Web Activity) -- MOBILE_PLAN.md §4
# M5, added 2026-08-30.
#
# MANUAL ONLY (workflow_dispatch), same posture as release-windows.yml: an APK
# is a decision, and nothing here talks to a dashboard, a NAS or the fleet.
# The artefact is downloaded and sideloaded by a studio admin, who then pastes
# the fingerprint this run prints into Settings -> ANDROID. docs/ANDROID.md is
# the whole path.
#
# WHY A RUNNER AND NOT THE BASE RIG. The base rig has node and Chrome and NO
# Java and no Android SDK, so an APK cannot be built there at all. An ubuntu
# runner image ships both, which is what makes this the cheapest place to
# prove the build -- Bubblewrap can install its own JDK and SDK, but only by
# asking interactively, and a runner cannot answer.
#
# SIGNING. Unsigned-for-release unless the secrets are present, and the run
# summary says which happened (release-windows.yml's rule, item 4). With no
# secrets the job generates a THROWAWAY debug keystore so the artefact is
# installable for testing; its fingerprint is different on every run, so an
# app signed with it can never be updated in place and must not be handed out.
#   CCSYNC_ANDROID_KEYSTORE_BASE64    the .keystore, base64'd into a secret --
#                                     the only form a hosted runner can use.
#   CCSYNC_ANDROID_KEYSTORE_PASSWORD
#   CCSYNC_ANDROID_KEY_ALIAS
#   CCSYNC_ANDROID_KEY_PASSWORD
#
# THE FIXTURE. Bubblewrap FETCHES the web app manifest and its icons; it does
# not take them on trust. The studio's real origin is on a tailnet a runner
# cannot reach, so by default this job serves tools/android/fixture/ with
# `python -m http.server` and points Bubblewrap at that -- which proves the
# toolchain end to end without pretending to have reached the NAS. Set
# `serve_fixture` to false and give a reachable `origin` for a real build.

name: android

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "The dashboard's origin the app is bound to (https://... for a real build)"
        required: true
        default: "http://127.0.0.1:8765"
      package_name:
        description: "Application id (blank: the origin's host reversed, + .ccsync)"
        required: false
        default: ""
      serve_fixture:
        description: "Serve tools/android/fixture/ locally and build against it"
        required: false
        default: "true"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FIXTURE_PORT: "8765"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The `secrets` context is not available in a step `if`; a job-level env
    # is visible to both. Same workaround, same reason, as release-windows.yml.
    env:
      KEYSTORE_B64: ${{ secrets.CCSYNC_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Bubblewrap wants a JDK 17+; pin it rather than trusting whichever the
      # runner image defaults to this month.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: report the toolchain
        run: |
          echo "node    $(node --version)"
          echo "java    $(java -version 2>&1 | head -n 1)"
          echo "sdk     ${ANDROID_HOME:-<unset>}"
          ls "${ANDROID_HOME:-/nonexistent}/build-tools" 2>/dev/null || echo "no build-tools listing"

      - name: materialise the signing keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signing: no CCSYNC_ANDROID_KEYSTORE_BASE64 secret -- this build uses a THROWAWAY DEBUG KEY. Installable for testing; never hand it to a studio (its fingerprint changes every run, so no installed copy can ever update)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ks="$RUNNER_TEMP/ccsync-android.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          echo "CCSYNC_ANDROID_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "signing: release keystore materialised from CCSYNC_ANDROID_KEYSTORE_BASE64" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Backgrounded with its PID recorded so the teardown below kills exactly
      # this process and nothing else on the runner.
      - name: serve the fixture web app manifest
        if: ${{ github.event.inputs.serve_fixture != 'false' }}
        run: |
          cd tools/android/fixture
          nohup python -m http.server "$FIXTURE_PORT" --bind 127.0.0.1 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          echo "FIXTURE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:$FIXTURE_PORT/manifest.webmanifest" >/dev/null && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$FIXTURE_PORT/manifest.webmanifest" | head -c 400
          echo "CCSYNC_ANDROID_WEB_MANIFEST=http://127.0.0.1:$FIXTURE_PORT/manifest.webmanifest" >> "$GITHUB_ENV"

      - name: build the APK and the AAB
        env:
          CCSYNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CCSYNC_ANDROID_KEYSTORE_PASSWORD }}
          CCSYNC_ANDROID_KEY_ALIAS: ${{ secrets.CCSYNC_ANDROID_KEY_ALIAS }}
          CCSYNC_ANDROID_KEY_PASSWORD: ${{ secrets.CCSYNC_ANDROID_KEY_PASSWORD }}
          PYTHON: python
        run: |
          bash tools/android/build_apk.sh \
            "${{ github.event.inputs.origin }}" \
            "${{ github.event.inputs.package_name }}" \
            build/twa 2>&1 | tee "$RUNNER_TEMP/build.log"
          exit "${PIPESTATUS[0]}"

      # The one number an admin has to carry off this page.
      - name: the fingerprint, in the run summary
        if: always()
        run: |
          {
            echo "### Android build"
            echo ""
            echo "origin: \`${{ github.event.inputs.origin }}\`"
            grep -E '^(package|fingerprint):' "$RUNNER_TEMP/build.log" | sed 's/^/    /' || \
              echo "    (no fingerprint printed -- the build did not get that far)"
            echo ""
            echo "Paste both into the dashboard's Settings -> ANDROID, then reopen the app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: what was built
        if: always()
        run: ls -l build/twa || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccsync-android
          if-no-files-found: warn
          path: |
            build/twa/*.apk
            build/twa/*.aab
            build/twa/twa-manifest.json

      - name: stop the fixture server
        if: always()
        run: |
          if [ -n "${FIXTURE_PID:-}" ]; then
            kill "$FIXTURE_PID" 2>/dev/null || true
          fi
