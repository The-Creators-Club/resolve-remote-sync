[project]
name = "broll-web"
version = "0.1.0"
description = "B-Roll Platform -- FastAPI search app + media server (SPEC.md 'web/')"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    # The CJK search_norm blob, computed SERVER-SIDE since 2026-08-18
    # (docs/BROLL_INGEST_PLAN.md §3.1, PR-D). app/normalize.py treats both as
    # optional and degrades to raw text, which is honest for a dev checkout --
    # but a deployment without them silently loses every two-character CJK
    # term, so they are hard dependencies here and in
    # dashboard/deploy/requirements.txt. jieba is MIT,
    # opencc-python-reimplemented is Apache-2.0 (tools/check_licenses.py).
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# fastembed (ONNX, no torch) is an OPTIONAL dependency -- app/semantic.py
# imports it lazily and degrades to "no semantic contribution" if it isn't
# installed. Not in the base `dependencies` list on purpose; install this
# extra to enable semantic search.
semantic = [
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
