# ccsync -- the customer-facing appliance stack. ZERO_TOUCH_PLAN.md section
# 3.6: "Container Manager -> Project -> Create -> paste this -> Build. Open
# http://<nas>:8480. Wizard." That is the entire install; everything else in
# this repo's docs/INSTALL.md, SERVER.md and RELEASE.md is what THIS file
# replaces (docs/APPLIANCE_INSTALL.md walks the paste-and-click path end to
# end; docs/DOCKER.md explains where the images come from).
#
# THERE ARE EXACTLY TWO THINGS TO FILL IN. Paste this file, then before
# `docker compose up` (Container Manager's "Environment" tab, or a plain
# `.env` beside this file on TrueNAS's "Install via YAML"):
#
#   CCSYNC_TREE=/volume1/Projects          # the shared folder that holds
#                                           #   Projects/, Assets/B-roll
#                                           #   Archive/, Assets/Music/ --
#                                           #   whatever the customer already
#                                           #   calls it. If it does not
#                                           #   have those subfolders yet,
#                                           #   the wizard's "Storage check"
#                                           #   step (ZERO_TOUCH_PLAN.md 3.5
#                                           #   step 5) creates them.
#   CCSYNC_DATA=/volume1/docker/ccsync     # where the stack keeps its OWN
#                                           #   state -- the dashboard's
#                                           #   database, generated secrets,
#                                           #   Syncthing's config, the sftp
#                                           #   sidecar's host keys, and the
#                                           #   tailnet node's own identity.
#                                           #   Never shared with any other
#                                           #   app on the NAS.
#
# `${CCSYNC_TREE:?...}` / `${CCSYNC_DATA:?...}` below make `docker compose
# up` refuse to start -- with a message naming exactly what is missing --
# rather than silently creating `./null` on the host, which is what an
# unset compose variable used to do here before this file existed.
#
# NOTHING ELSE ON THIS FILE IS A SECRET, AND NONE OF IT SHOULD BE EDITED.
# `DASH_RELEASE_PUBKEYS`, `SYNCTHING_API_KEY`, `CCSYNC_INTERNAL_TOKEN` and
# every other credential `dashboard/deploy/compose.yaml` still asks an
# operator to type by hand (as `REPLACE_ME`) do not appear here at all: the
# dashboard generates them into `${CCSYNC_DATA}/data/secrets/` the first time
# it boots (ZERO_TOUCH_PLAN.md 3.2's SetupEngine, WP D -- not yet built; see
# "secrets-init" below for what stands in for that generation TODAY, in
# WP A). The customer never sees one.
#
# WHAT COMPOSE VERSION THIS TARGETS. Synology's Container Manager on the
# DS423+ this was verified against ships Docker Compose v2.20.1
# (`docs/synology-spikes-2026-08-17.md`), which vendors compose-go v1.16.0 --
# confirmed by reading that exact tag's `types/types.go` -- and that release
# predates BOTH the long-form `env_file: [{path:, required: false}]` syntax
# (compose-spec PR #448, merged 2023-12-20, is not in v1.16.0's schema at
# all: `EnvFile` there is a plain string list) AND, separately, whatever a
# customer's own DSM/SCALE build happens to have shipped since. Every
# `env_file:` below is therefore the OLD plain-string-list form, on purpose,
# and "secrets-init" (not a `required: false` env_file) is what guarantees
# the files it points at exist before anything that needs them starts.
# `depends_on: condition: service_completed_successfully`, which that
# guarantee rests on, WAS already in v1.16.0 (same file, `types.go`'s
# `ServiceConditionCompletedSuccessfully` constant) -- so this works on the
# oldest compose this plan has actually measured, with no "run `up` twice"
# caveat for anyone to hit.
#
# SERVICES: dashboard (the app), syncthing (lane C, bundled+always-on here,
# never the customer's own catalog app), sftp (lanes A/B, chrooted
# internal-sftp -- dashboard/deploy/sftp/README.md), tailscale (the stack's
# OWN tailnet node -- syncthing and sftp share its network namespace, so
# :22000 and :22 are reachable on the node's tailnet IP with no host port
# published for either), and secrets-init (this file's own answer to "how do
# Syncthing and the sftp sidecar -- neither of which can read
# `${CCSYNC_DATA}/data/secrets/*.json` themselves -- get a `.env` file that
# is guaranteed to exist", above).
#
# uid:gid. `${APP_UID:-3000}:${APP_GID:-3001}` is this fleet's existing
# convention (`broll:editors` on the current TrueNAS site) and works
# unchanged on TrueNAS SCALE. On Synology, DSM assigns uids >= 1026 and will
# not let an app pick 3000 -- the wizard's "Your studio" step reads the
# REAL uid/gid of the account Container Manager actually used and writes it
# back as `APP_UID`/`APP_GID` (compose environment or the same `.env`), which
# is why every `user:` line below is a variable, never a literal. Until the
# wizard exists (WP D), set them by hand from `id <the DSM account>` before
# the first `up` on Synology; TrueNAS SCALE's default is already right.

services:
  # --- one-shot: makes sure syncthing/sftp have a real .env before they
  # need one (see the compose-version note above for why this exists instead
  # of `env_file: required: false`). Reuses the dashboard image purely as a
  # convenient shell+python -- it never runs the app itself (entrypoint is
  # overridden), so no extra image has to be pulled just for this.
  secrets-init:
    image: "${CCSYNC_IMAGE:-ghcr.io/the-creators-club/ccsync}:1"
    # Root, not APP_UID: `${CCSYNC_DATA}/data` does not exist on a customer's
    # NAS before the very first `up`, and Docker creates a missing bind-mount
    # SOURCE directory as root:root mode 755 -- which APP_UID could not then
    # write into. This is the one place in the whole stack that is
    # deliberately root, and its ONLY job is to create/own two small files
    # and hand `/data` itself to APP_UID so every other service never needs
    # to be root at all (mirrors the "small root-in-container helper for
    # tree ownership repair" ZERO_TOUCH_PLAN.md 3.1 already names -- this is
    # that helper's secrets-directory sibling, landed here because WP D's
    # SetupEngine does not exist yet).
    user: "root"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # FILE NAMES ARE A CONTRACT (dash-admin-2, 2026-08-21). These two
        # files are what the syncthing and sftp services env_file below, AND
        # what the dashboard's secrets_boot.ensure_secrets ADOPTS on first
        # boot (secrets_boot.SIDECAR_ENV_FILES) instead of generating a
        # second value of its own. Rename either one here and the dashboard
        # mints a different token than the sidecar presents: every
        # AuthorizedKeysCommand call 401s and no editor can authenticate.
        mkdir -p /data/secrets
        if [ ! -f /data/secrets/syncthing.env ]; then
          key="$$(python -c 'import secrets; print(secrets.token_hex(16))')"
          printf 'STGUIAPIKEY=%s\n' "$$key" > /data/secrets/syncthing.env
          echo "secrets-init: generated Syncthing's STGUIAPIKEY"
        fi
        if [ ! -f /data/secrets/internal.env ]; then
          tok="$$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf 'CCSYNC_INTERNAL_TOKEN=%s\n' "$$tok" > /data/secrets/internal.env
          echo "secrets-init: generated the sftp sidecar's CCSYNC_INTERNAL_TOKEN"
        fi
        chown -R ${APP_UID:-3000}:${APP_GID:-3001} /data/secrets
        chmod 700 /data/secrets
        chmod 600 /data/secrets/syncthing.env /data/secrets/internal.env
        # /data itself, NOT recursive -- everything the dashboard creates
        # under it afterwards is its own job (and, once the fleet is large,
        # `chown -R` over a multi-GB /data on every single `docker compose
        # up` would be slow for no reason). Docker made /data root:root 755
        # on the very first `up`; this is what lets APP_UID create anything
        # in it at all.
        chown ${APP_UID:-3000}:${APP_GID:-3001} /data
        chmod 750 /data
        echo "secrets-init: done"
    volumes:
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/data:/data
    restart: "no"
    # The same 100 MB stdout cap the dashboard service carries
    # (ops-efficiency-7, 2026-08-21): json-file has no default limit and
    # nobody reads an appliance's logs until something has gone wrong.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  dashboard:
    image: "${CCSYNC_IMAGE:-ghcr.io/the-creators-club/ccsync}:1"
    user: "${APP_UID:-3000}:${APP_GID:-3001}"
    command: ["/bin/sh", "/app/deploy/run.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      APP_UID: "${APP_UID:-3000}"
      APP_GID: "${APP_GID:-3001}"
      DASH_DB_PATH: "/data/dashboard.db"
      DASH_PORT: "8480"
      DASH_PROJECTS_DIR: "/projects"
      DASH_CRASH_DIR: "/data/crashes"
      # site.toml stops being a customer artefact on this path
      # (ZERO_TOUCH_PLAN.md 3.2): everything that used to be a `{{ }}`
      # template value here -- org name, tree name, NAS kind, the SFTP/
      # Syncthing facts `GET /api/v1/site` publishes -- is a row in the
      # dashboard's own DB, written by the wizard (WP D). Nothing about the
      # site is baked into this file, and DASH_NAS_KIND is left UNSET on
      # purpose: an unset value is how the dashboard knows the wizard has
      # not run yet, not a value meaning "TrueNAS" or "Synology".
      #
      # No REPLACE_ME anywhere below this line, and none of
      # SYNCTHING_API_KEY / DASH_REPORT_TOKEN / DASH_SESSION_SECRET /
      # BROLL_INGEST_TOKEN / DASH_RELEASE_PUBKEYS / TRUENAS_PW appear at
      # all: those are generated into ${CCSYNC_DATA}/data/secrets/ on first
      # boot (WP D) and read from there, not from compose environment.
    volumes:
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/data:/data
      # ${CCSYNC_TREE} is the ROOT that holds Projects/, Assets/B-roll
      # Archive/ and Assets/Music/ -- the same NAS_TREE_ROOT shape
      # dashboard/deploy/compose.yaml already documents, not a folder named
      # literally "Projects". Each subfolder gets its own scoped mount
      # (least privilege, same posture as compose.yaml/compose.image.yaml)
      # rather than handing the dashboard the whole tree.
      - ${CCSYNC_TREE:?set CCSYNC_TREE to the shared folder your projects live in, e.g. /volume1/Projects}/Projects:/projects:rw
      - "${CCSYNC_TREE:?set CCSYNC_TREE to the shared folder your projects live in, e.g. /volume1/Projects}/Assets/B-roll Archive:/broll-data:rw"
      - "${CCSYNC_TREE:?set CCSYNC_TREE to the shared folder your projects live in, e.g. /volume1/Projects}/Assets/Music:/music-share:rw"
      # How the dashboard (WP B, not yet built) drives the tailnet login AND
      # sets Serve -- NOT a config file. `docs/spikes/zero-touch-spikes-2026-08-17.md`
      # S1c proved a second, unrelated container can open this same socket
      # with nothing but Python's stdlib and get real answers from `PATCH
      # /localapi/v0/prefs`, `POST /localapi/v0/login-interactive`, `GET
      # /localapi/v0/status` and (once `BackendState=="Running"`) `POST
      # /localapi/v0/serve-config` -- see the `tailscale` service below for
      # why containerboot's `TS_SERVE_CONFIG` file was dropped in favour of
      # this.
      - tailscale-sock:/var/run/tailscale
    # 127.0.0.1 ONLY -- everything a customer or an editor actually reaches
    # goes through the `tailscale` service's Serve config
    # (`https://ccsync-<studio>.<tailnet>.ts.net` -> this container, over
    # the compose network, not this port). This loopback bind exists purely
    # so the NAS's own admin can reach the wizard from the NAS host itself
    # (an SSH tunnel, or the box's own browser) before the tailnet node has
    # even been signed in -- there is no other way in until it has been.
    ports:
      - "127.0.0.1:8480:8480"
    restart: unless-stopped
    # A CAP ON THIS CONTAINER'S STDOUT (ops-efficiency-7, 2026-08-21).
    # docker's json-file driver has no limit of its own, and an APPLIANCE is
    # precisely the deployment nobody logs into: every companion posts
    # /api/v1/report every 5 s while a lane syncs and every open tab polls
    # /partials/* every 2 s, so unbounded stdout fills the customer's disk and
    # makes `docker logs` useless for the one time it matters. run.sh drops
    # uvicorn's access log for the same reason. 100 MB total, five files, so a
    # rotation still leaves the last few hours of an incident to read. Same
    # block as compose.yaml and install_dashboard_app.LOG_ROTATION.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Identical to dashboard/deploy/compose.yaml's own healthcheck --
    # server/tests/test_safety.py holds compose.yaml and compose.image.yaml
    # to matching text; keep this one in the same shape by hand until this
    # file gets a render path of its own (it has none today -- see
    # docs/DOCKER.md's "Not done here").
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8480/api/v1/health', timeout=5)).get('ok') else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Always on -- there is no `bundled-syncthing` PROFILE here the way
  # compose.yaml carries one (that profile exists so a live TrueNAS site can
  # opt in without disturbing its existing catalog-app Syncthing;
  # the appliance has no such history to protect, so lane C is simply always
  # this container). SYNOLOGY_PORT_PLAN's decision 3, unconditionally.
  syncthing:
    image: syncthing/syncthing:1.30.0
    user: "${APP_UID:-3000}:${APP_GID:-3001}"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      # NOT just "the tailscale container exists" -- `condition:
      # service_started` (compose's default anyway, spelled out here on
      # purpose) orders this AFTER tailscale on every deliberate `up`/
      # `restart`, which is what re-attaches this service to a FRESH
      # network namespace when tailscale's own container is recreated.
      # `docs/spikes/zero-touch-spikes-2026-08-17.md` S5 measured the thing
      # this does NOT cover: if `tailscaled` itself crashes and Docker
      # restarts JUST the tailscale container (no compose command run),
      # this service is left attached to the OLD, now-orphaned netns and
      # goes unreachable on the tailnet until an admin runs `docker compose
      # up` (or restarts this service too) by hand. A healthcheck-driven
      # auto-restart of the dependents is real, not-yet-built follow-up
      # work; today it is a manual recovery step, worth knowing about
      # before ANY of this reaches a customer.
      tailscale:
        condition: service_started
    # The plain string-list form -- see the compose-version note at the top
    # of this file for why this is NOT `env_file: [{path:, required:
    # false}]`. secrets-init guarantees this file exists before compose ever
    # tries to start this container.
    env_file:
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/data/secrets/syncthing.env
    environment:
      STGUIADDRESS: "0.0.0.0:8384"
    volumes:
      - ${CCSYNC_TREE:?set CCSYNC_TREE to the shared folder your projects live in, e.g. /volume1/Projects}:/data
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/syncthing-config:/var/syncthing/config
    # Shares the tailnet node's network namespace -- :22000 (sync protocol)
    # and :21027 (local discovery) become reachable on the NODE's tailnet
    # IP, with NOTHING published on the NAS host at all. The GUI
    # (STGUIADDRESS above) is deliberately never exposed anywhere outside
    # this namespace -- the dashboard is Syncthing's only admin surface,
    # same posture as compose.yaml's own bundled-syncthing profile.
    # CONFIRMED on this same box (S5): the two containers share one eth0 and
    # :8480 on 127.0.0.1 inside tailscale's netns reached a service in this
    # position; the orphaned-netns caveat above is the ONE thing that does
    # not just work.
    network_mode: service:tailscale
    restart: unless-stopped
    # The same 100 MB stdout cap the dashboard service carries
    # (ops-efficiency-7, 2026-08-21): json-file has no default limit and
    # nobody reads an appliance's logs until something has gone wrong.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  sftp:
    image: "${CCSYNC_SFTP_IMAGE:-ghcr.io/the-creators-club/ccsync-sftp}:1"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      # See syncthing's own comment on this same key -- identical reasoning,
      # identical caveat.
      tailscale:
        condition: service_started
    env_file:
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/data/secrets/internal.env
    environment:
      APP_UID: "${APP_UID:-3000}"
      APP_GID: "${APP_GID:-3001}"
    # Per-project bind views (dashboard/deploy/sftp/README.md "per-project
    # bind views are proven, not built") -- spike S3
    # (docs/spikes/zero-touch-spikes-2026-08-17.md) proved a root process
    # INSIDE this one service can `mount --bind` a single project directory
    # into a second chroot and have sshd see it immediately, with NO other
    # service in this stack needing either line. WP C is the code that
    # would actually issue those mounts from the dashboard's per-editor
    # project selection; until it exists these two lines are inert (nothing
    # in this image calls `mount` today) but landing them now means WP C is
    # a code change, not a second edit to every customer's already-running
    # compose file.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - "apparmor=unconfined"
    volumes:
      # The WHOLE tree root, unlike the dashboard's three scoped mounts --
      # an editor's rclone needs to see Projects/ AND both Assets/ shares
      # under one sftp root, exactly as it does against the NAS host's own
      # sshd today (dashboard/deploy/sftp/README.md "chroot layout").
      - ${CCSYNC_TREE:?set CCSYNC_TREE to the shared folder your projects live in, e.g. /volume1/Projects}:/jail/tree:rw
      # Host keys PERSIST here. Never wiped between `up`s, never regenerated
      # once present (dashboard/deploy/sftp/README.md "host keys persist,
      # deliberately").
      #
      # This comment used to claim "a changed host key makes every editor's
      # rclone refuse the NAS on its next connection". IT DOES NOT, and
      # believing it is worse than not having it (trust-model-4, corrected
      # 2026-08-21): both bootstraps write the rclone sftp stanza with NO
      # known_hosts_file and the companion passes no --sftp-known-hosts-file,
      # so rclone accepts ANY host key, and /api/v1/site publishes none for it
      # to check against. Lanes A and B authenticate the editor TO the NAS and
      # never the NAS to the editor; inside the tailnet WireGuard authenticates
      # the peer, which is the only reason this has not bitten.
      #
      # Persisting them still matters -- an interactive `ssh` from the base
      # rig, and anything that later DOES pin (docs/SERVER.md "Editor lanes do
      # NOT verify the NAS host key" has the four-part shape of that fix) --
      # but nothing on an editor machine notices today.
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/sftp-hostkeys:/etc/ssh/keys
    # :22 becomes reachable on the tailnet node's own IP, same as
    # Syncthing's :22000 above -- no host port for this either.
    network_mode: service:tailscale
    restart: unless-stopped
    # The same 100 MB stdout cap the dashboard service carries
    # (ops-efficiency-7, 2026-08-21): json-file has no default limit and
    # nobody reads an appliance's logs until something has gone wrong.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  tailscale:
    # Pinned to the EXACT digest the spike resolved and ran
    # (docs/spikes/zero-touch-spikes-2026-08-17.md S1: `v1.102.2-teb67e5dcb`,
    # built 2026-07-31) -- not just the `v1.102.2` tag, for the same reason
    # every other pin in this repo goes by digest where the target is a
    # security-sensitive edge (dashboard/deploy/Dockerfile's own comment).
    image: "tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24"
    hostname: ccsync
    # NO containerboot. The stock entrypoint's `tailscale up` gives up after
    # 60 SECONDS if nobody has visited the login link yet, SIGTERMs
    # tailscaled and exits -- with `restart: unless-stopped` that is a
    # crash-loop that mints a BRAND NEW AuthURL every ~66s (measured: four
    # different codes in five minutes), so a wizard reading "the" login link
    # would show a dead one almost immediately
    # (docs/spikes/zero-touch-spikes-2026-08-17.md S1b). Running `tailscaled`
    # directly instead sat in `NeedsLogin` with ZERO restarts for the rest of
    # that spike (12+ minutes) -- this is the shape the dashboard's own login
    # flow (WP B) is built against: `PATCH /localapi/v0/prefs` ->
    # `POST /localapi/v0/login-interactive` -> poll `GET /localapi/v0/status`
    # for `AuthURL`, then `BackendState=="Running"` -- all three calls proven
    # from a second, unrelated container reading the SAME shared socket
    # volume below (S1c). No `TS_AUTHKEY` anywhere: minting one means the
    # customer visits their own admin console, which is precisely the step
    # this whole design exists to remove.
    entrypoint:
      - "tailscaled"
      - "--socket=/var/run/tailscale/tailscaled.sock"
      - "--statedir=/var/lib/tailscale"
      - "--tun=userspace-networking"
    # ONE env var, and it is OFF unless somebody sets it (MOBILE_PLAN.md
    # M6, 2026-08-30). Every `TS_*` var (TS_STATE_DIR, TS_SOCKET,
    # TS_HOSTNAME, TS_SERVE_CONFIG, TS_AUTH_ONCE, TS_USERSPACE...) is
    # containerboot's OWN vocabulary and bare `tailscaled` above reads none
    # of them, so an EMPTY `TS_SERVE_CONFIG` is exactly as inert as the "no
    # environment: block at all" this file carried until today. What changed
    # is that the phone port NEEDS a secure origin -- a service worker, an
    # installable manifest and a TWA all refuse anything but https -- and
    # `deploy/tailscale/serve.json` (mounted read-only at /config below) is
    # now the one place the TLS-on-443 -> dashboard:8480 answer is written
    # down, for containerboot here and for the dashboard's own
    # `POST /localapi/v0/serve-config` in WP B, which is the same document.
    #
    # THE SWITCH CARRIES THE PATH, NOT A `1`, on purpose: compose-go v1.16.0
    # (the oldest compose this file targets -- see the note at the top)
    # interpolates `:-`, `-`, `:?` and `?` and has no `${VAR:+alternative}`
    # form, so this file cannot turn a `1` into a filename. Turning it on is
    #   DASH_TAILSCALE_SERVE=/config/serve.json
    # in the same Environment tab / `.env` as CCSYNC_TREE and CCSYNC_DATA.
    #
    # TWO THINGS TO KNOW BEFORE FLIPPING IT. (1) containerboot is what reads
    # this variable, and the `entrypoint:` override above deliberately does
    # not run containerboot (S1b: its `tailscale up` gives up after 60 s and
    # crash-loops a new AuthURL every cycle) -- so the variable only bites on
    # a deployment that has also dropped that override AND has a TS_AUTHKEY.
    # (2) `POST /localapi/v0/serve-config` 500s "netMap is nil" until the node
    # is logged in (docs/spikes/zero-touch-spikes-2026-08-17.md S1c), so on
    # the appliance path Serve stays something the dashboard sets ONLY AFTER
    # `BackendState=="Running"`. Until WP B lands, the studio recipe in
    # docs/DOCKER.md ("Serving the dashboard over https") is the path that
    # actually runs today, and this pair is the product's version of it.
    environment:
      TS_SERVE_CONFIG: "${DASH_TAILSCALE_SERVE:-}"
    volumes:
      - ${CCSYNC_DATA:?set CCSYNC_DATA to a folder this stack owns, e.g. /volume1/docker/ccsync}/tailscale:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
      # The DIRECTORY, not the file, and no variable in front of it. Docker
      # creates a missing bind-mount source, and a missing DIRECTORY is an
      # empty directory (harmless, and nothing reads it while
      # TS_SERVE_CONFIG is empty) whereas a missing FILE would be created as
      # a directory in the file's place -- a shape that only ever confuses
      # whoever looks next. `./tailscale` is `dashboard/deploy/tailscale/`,
      # beside this file, so a checkout-based deployment gets serve.json for
      # free; a customer who pasted this file into Container Manager and
      # wants Serve copies that one JSON next to their compose file.
      - ./tailscale:/config:ro
    # NO PORTS. Serve is what makes this node reachable at all
    # (https:443 -> http://dashboard:8480 on the compose network, once the
    # dashboard has driven the login above and then set Serve) -- there is
    # nothing to publish on the NAS host for this service, ever.
    #
    # KERNEL-MODE OPT-IN (throughput; userspace vs kernel SFTP/sync
    # throughput through this node specifically still needs a real tailnet
    # login to measure -- S1's own "still owed" list) -- CONFIRMED to work on
    # this box otherwise (S1 "Kernel mode on this box": `ip -o link` showed a
    # real `tailscale0` interface with both lines present, refused without
    # `--device`). Uncomment together, never one alone:
    #   devices:
    #     - /dev/net/tun
    #   cap_add:
    #     - NET_ADMIN
    # and add `--tun=tailscale0` in place of `--tun=userspace-networking`
    # above (bare `tailscaled`, no containerboot, so there is no separate
    # TS_USERSPACE switch to flip -- the flag on the entrypoint line IS the
    # switch).
    restart: unless-stopped
    # The same 100 MB stdout cap the dashboard service carries
    # (ops-efficiency-7, 2026-08-21): json-file has no default limit and
    # nobody reads an appliance's logs until something has gone wrong.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# tailscale-sock: how the dashboard (no shared network namespace with
# tailscale) still reaches tailscaled's LocalAPI over the unix socket file --
# a network namespace only matters for TCP/UDP, not for a socket FILE two
# containers both have mounted (proven with a THIRD, unrelated image reading
# it in docs/spikes/zero-touch-spikes-2026-08-17.md S1c). syncthing/sftp get
# the same socket via their `network_mode: service:tailscale` instead; they
# do not need this volume listed separately.
volumes:
  tailscale-sock:
