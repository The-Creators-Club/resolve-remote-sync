[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broll-companion"
version = "0.1.0"
description = "Local agent that inserts b-roll clips into DaVinci Resolve for the broll-platform web UI."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
broll-companion = "broll_companion.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
