[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsync-companion"
version = "0.7.1"
description = "Editor-side companion app for the Creators Club Resolve remote-sync system: timeline watcher, move-and-relink popup, and rclone/Syncthing sync lanes."
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4",
]

[project.optional-dependencies]
# pyobjc-framework-Cocoa is pinned here rather than left to pystray: we call
# AppKit/Foundation DIRECTLY (shutdown_guard's NSWorkspace notifications and
# the app-activation policy that keeps this out of the Dock), so the import
# has to be guaranteed by our own dependency list. pystray happens to pull
# pyobjc in today; a future release choosing a different backend would take
# our code with it. sys_platform marker so Windows installs stay unchanged.
tray = [
    "pystray>=0.19",
    "Pillow>=10",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
ccsync-companion = "ccsync_companion.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
