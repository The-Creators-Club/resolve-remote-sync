[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsync-companion"
version = "0.9.50"
description = "Editor-side companion app for the CC Sync Resolve remote-sync system: timeline watcher, move-and-relink popup, and rclone/Syncthing sync lanes."
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4",
    # `videos.hash` is xxh64(first 8 MiB + last 8 MiB + size) -- broll/schema.sql
    # and broll_index/hashing.py. The companion computes it now, because b-roll
    # ingest dedupes an editor's dropped clips against the live archive BEFORE
    # anything is uploaded (docs/BROLL_INGEST_PLAN.md §3.3), and a different
    # digest would mean re-ingesting an archive that is already there. Not a
    # hashlib algorithm and not reimplementable in a few lines: xxh64 is the
    # digest 12,000 existing rows carry. BSD-2-Clause, one small C extension
    # (tools/check_licenses.py).
    "xxhash>=3.4",
    # The CLAP AUDIO tower runs HERE now (docs/MUSIC_INGEST_PLAN.md §1): an
    # editor drops an album on the dashboard's music page and this machine
    # embeds it, because the container has no torch and uploading the audio to
    # wait for the base rig's GPU is the loop that feature exists to replace.
    #
    # numpy is the mel front end (`music_clap/mel_numpy.py`, vendored from the
    # indexer) and the waveform overview; onnxruntime executes the exported
    # tower. BSD-3-Clause and MIT respectively -- both clear
    # tools/check_licenses.py -- and neither pulls torch in: the pip
    # `onnxruntime` wheel is the CPU build, ~16 MB, and a machine that happens
    # to have the CUDA/DirectML package installed is used if it does
    # (music_clap_sidecar._providers_for_session) and never required.
    #
    # They are unconditional dependencies rather than an extra because the
    # frozen build is one binary for the whole fleet: an extra would mean a
    # second artefact, which is the thing CLAUDE.md's "never a second binary"
    # rules out. Cost is ~35 MB frozen (measured on the wheels: numpy ~19 MB
    # installed, onnxruntime ~16 MB) against a 40-odd MB exe.
    "numpy>=1.26",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
# pystray is GONE from this list (2026-08-17, docs/COMMERCIAL_READINESS.md
# item 3): it is LGPLv3 and the companion ships as a single-file PyInstaller
# freeze, which conveys it without the relinking freedom §4 requires. The tray
# is ccsync_companion/tray_native.py now -- ctypes on Windows, PyObjC on macOS,
# written from the OS APIs. tray.py's CCSYNC_TRAY_BACKEND=pystray escape hatch
# is for a developer who installs pystray by hand; it must not become a
# declared dependency again, and it refuses to load in a frozen build.
#
# pyobjc-framework-Cocoa was already pinned here rather than left to pystray --
# we call AppKit/Foundation DIRECTLY (shutdown_guard's NSWorkspace
# notifications, the app-activation policy that keeps this out of the Dock, and
# now the NSStatusItem itself) -- and with pystray gone it is the ONLY thing
# guaranteeing pyobjc is present at all. sys_platform marker so Windows
# installs stay unchanged.
tray = [
    "Pillow>=10",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
ccsync-companion = "ccsync_companion.app:run"

[tool.setuptools.packages.find]
where = ["src"]

# The vendored local-VLM prompt (2026-08-18, docs/BROLL_INGEST_PLAN.md §3.3).
# `broll_vlm/compact_format.py` reads it off disk beside itself, so a pip
# install of this package without it imports fine and fails on the first clip.
# The frozen build has its own declaration in build.spec's `datas` -- neither
# covers the other.
[tool.setuptools.package-data]
"ccsync_companion.broll_vlm" = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
