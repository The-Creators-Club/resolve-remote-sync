<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Link not available</title>
<!-- What a dead client-folder link shows (docs/CLIENT_FOLDERS.md): revoked,
     expired, or never existed -- deliberately the same page for all three.
     Served with a 404. Self-contained on purpose: this page must not depend
     on the token's own asset path resolving, because there may be no token. -->
<style>
  html, body { margin: 0; background: #0a0a0d; color: #e8e8ea;
               font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 13px; }
  .wrap { max-width: 560px; margin: 18vh auto 0; padding: 0 24px; }
  h1 { color: #ff2140; font-size: 15px; letter-spacing: 0.08em; text-shadow: 0 0 12px rgba(255,33,64,.55); }
  p { color: #6f6f7a; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>THIS LINK IS NOT AVAILABLE</h1>
  <p>The footage preview you were sent has been closed, has expired, or the address is not quite right.</p>
  <!-- UX-19 (resilience sweep 2026-08-28): routes_share._gone_page replaces
       the sentence below, verbatim and once, with the curating editor's name
       and contact when the token is one we still recognise (revoked or
       expired). It stays here as the wording for a token we know nothing
       about, which is the only case where there is genuinely nobody to name.
       If you edit it, edit client_folders.GONE_FALLBACK_SENTENCE too -- the
       substitution is an exact string match and a silent miss would leave
       every client at the same dead end this finding is about. -->
  <p>Please contact whoever sent it to you for a fresh link.</p>
</div>
</body>
</html>
