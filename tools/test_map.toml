# The one path -> tests map. docs/MODULAR_UPDATES.md Part A, phase M1
# (2026-10-06). Read by tools/select_suites.py; checked by
# tools/tests/test_test_map.py.
#
# HOW IT IS READ
#   * [[area]] rows are tried IN FILE ORDER and the FIRST match wins, so the
#     narrow rows (the version stamp, the shared files that force the full
#     gate) come before the broad ones they carve out of.
#   * A path no row matches selects the FULL gate. That is the map's bug,
#     never a reason to skip tests -- and test_test_map.py fails on any
#     tracked file that is unmapped, so it stays an exception.
#   * tier: neutral        -> smoke set only (+ the row's own tests)
#           scoped         -> the row's suites and tests, plus smoke
#           dashboard-wide -> [tiers] dashboard-wide, plus the row's own, plus smoke
#           full           -> every suite and every [[full_check]]
#   * suites = whole suites; tests = repo-relative globs of test FILES.
#     `**` spans directories, `*` does not.
#
# HOW IT IS KEPT TRUE
#   `python tools/select_suites.py --audit` walks every test file's imports
#   and the repo paths it names in string literals, and prints the row to
#   change for every test a change would NOT select. test_test_map.py runs it.
#   A new cross-tree test lands with its row here, or the tools suite fails.

# ---------------------------------------------------------------- the suites
# Exactly the rows tools/run_all_tests.ps1 runs (test_test_map.py pins the two
# lists equal). `files` names the suite's test files; `runner = "script"` rows
# are run whole or not at all.

[suites.companion]
dir = "companion"
files = ["companion/tests/**/test_*.py"]

[suites.dashboard]
dir = "dashboard"
files = ["dashboard/tests/**/test_*.py"]

[suites.server]
dir = "server"
files = ["server/tests/**/test_*.py"]

[suites.onboarding]
dir = "onboarding"
files = ["onboarding/tests/**/test_*.py"]

[suites.bench]
dir = "bench"
files = ["bench/tests/**/test_*.py"]

[suites."broll/web"]
dir = "broll/web"
files = ["broll/web/tests/**/test_*.py"]

[suites."broll/indexer"]
dir = "broll/indexer"
files = ["broll/indexer/tests/**/test_*.py"]

[suites."music/web"]
dir = "music/web"
files = ["music/web/tests/**/test_*.py"]

[suites."music/indexer"]
dir = "music/indexer"
files = ["music/indexer/tests/**/test_*.py"]

[suites."ytdl/web"]
dir = "ytdl/web"
files = ["ytdl/web/tests/**/test_*.py"]

[suites.tools]
dir = "tools"
files = ["tools/tests/**/test_*.py"]

[suites.installer]
dir = "installer"
runner = "script"
files = ["installer/tests/Test-*.ps1"]

[suites."installer/macos"]
dir = "installer"
runner = "script"
files = ["installer/tests/test_*.sh"]

# ------------------------------------------------------------------ the tiers
# dashboard-wide: the dashboard suite plus every suite that imports
# ccsync_dashboard (A.1). Not companion, onboarding, bench, the indexers or
# the installer. `full` is every suite above and is not listed.
[tiers]
dashboard-wide = ["dashboard", "broll/web", "music/web", "ytdl/web", "tools", "server"]

# The two non-pytest checks the full gate adds (A.1 tier 4). Run from the
# repo root under the dashboard venv, as CLAUDE.md's "part of the gate" line
# says. CI runs check_licenses with --strict, where every lock is installed;
# here it is not, so it is the warning-level run.
[[full_check]]
name = "licenses"
argv = ["tools/check_licenses.py"]

[[full_check]]
name = "notices"
argv = ["tools/gen_notices.py", "--check"]

# ------------------------------------------------------------- the smoke set
# A.2: runs whatever changed. Small, fast, and aimed at the seams between the
# modules, which is exactly what a scoped run would otherwise miss. M0 holds
# it to a two-minute budget; split a slow file rather than drop it.
[smoke]
tests = [
    # boot and mounts
    "dashboard/tests/test_smoke_boot.py",
    "dashboard/tests/test_mount_status.py",
    "dashboard/tests/test_broll_mount.py",
    "dashboard/tests/test_music_mount.py",
    "dashboard/tests/test_ytdl_mount.py",
    "dashboard/tests/test_cards_mount.py",
    "dashboard/tests/test_secrets_boot.py",
    # cross-module contracts: document-relative URLs under each mount, and the
    # identity / fleet-auth copies ("MUST NOT DRIFT") each sub-app carries.
    # The module-API range test (B.3) joins this list with M4.
    "broll/web/tests/test_mounted_prefix.py",
    "music/web/tests/test_mounted_prefix.py",
    "ytdl/web/tests/test_mounted_prefix.py",
    "broll/web/tests/test_fleet_credentials.py",
    "ytdl/web/tests/test_fleet_credentials.py",
    "music/web/tests/test_fleet_ingest.py",
    # owner rules: every suite's em-dash scan, and the docs index
    "dashboard/tests/test_no_em_dash.py",
    "broll/web/tests/test_no_em_dashes.py",
    "music/web/tests/test_no_em_dashes.py",
    "ytdl/web/tests/test_no_em_dash.py",
    "tools/tests/test_docs_index.py",
    # the map's own check: a new cross-tree test, or a file no area claims,
    # fails the scoped run it arrives in rather than the nightly
    "tools/tests/test_test_map.py",
]

# --------------------------------------------------------------- the import
# roots the audit resolves `import x` against (after the test's own directory
# and its suite's directory, which is where `python -m pytest` runs from).
[audit]
import_roots = [
    "dashboard/src",
    "companion/src",
    "broll/web",
    "music/web",
    "ytdl/web",
    "server",
    "tools",
    "onboarding",
    "bench",
    "broll/indexer",
    "music/indexer",
]

# ================================================================== the areas

# --- the version stamp ------------------------------------------------------
# Every dashboard and companion commit bumps one of these. Neutral ONLY when
# the diff of that file against the base is the VERSION line alone; anything
# more falls through to the rows below (pyproject -> dependencies -> full,
# __init__.py -> dashboard core, config.py -> companion).
[[area]]
name = "version stamp"
tier = "neutral"
version_line_only = true
paths = [
    "dashboard/src/ccsync_dashboard/__init__.py",
    "dashboard/pyproject.toml",
    "companion/src/ccsync_companion/config.py",
    "companion/pyproject.toml",
]
# The two pins that say the two copies of each VERSION agree. The audit cannot
# find these (it never treats a file as version-only), so they are named here:
# a bump that moves one copy and not the other is exactly what a neutral run
# must still catch.
tests = [
    "dashboard/tests/test_hardening.py",
    "companion/tests/test_config.py",
]

# --- what forces the full gate (A.3) -----------------------------------------

[[area]]
name = "the gate itself"
tier = "full"
why = "decides what the tests themselves mean"
paths = [
    "tools/test_map.toml",
    "tools/select_suites.py",
    "tools/run_all_tests.ps1",
    "tools/ship*",
    ".github/**",
    "**/conftest.py",
    ".gitattributes",
]

[[area]]
name = "dependencies"
tier = "full"
why = "every lock and dependency list; a pyproject change beyond the VERSION line"
paths = [
    "**/requirements*.lock",
    "**/requirements*.txt",
    "**/requirements*.in",
    "**/pyproject.toml",
]

