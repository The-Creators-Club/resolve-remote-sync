# CI for CC Sync -- COMMERCIAL_READINESS.md item 13, added 2026-08-17.
#
# Until now the ~5,250 tests ran when someone remembered to run them, on one
# Windows box, and `tools\ship.cmd` gated only on the `server/` suite. Nothing
# ran on a Mac at all, which is half of why Mac editors are a fix pass behind.
#
# THREE THINGS THIS DOES THAT THE LOCAL WORKFLOW CANNOT:
#   1. Runs every suite on every push, on the OS each one is FOR.
#   2. Installs from requirements.lock with --require-hashes, so "what was this
#      tested against" has an answer.
#   3. Puts a macOS runner in the loop (see also release-macos.yml, which is
#      what actually closes the "Mac builds need a Mac" gap).
#
# WHAT IT CANNOT DO. A GitHub runner cannot reach the NAS, the tailnet, an
# editor machine, DaVinci Resolve or a real rclone remote. Suites that need any
# of those already skip themselves (they probe for the binary or the host); if
# you add one that does not, make it skip rather than making CI green by
# deleting it. `docs/CI.md` lists what is therefore NOT covered here.
#
# Interpreter/working-directory rules are CLAUDE.md's, verbatim, and two of them
# are load-bearing rather than stylistic:
#   - `python -m pytest` FROM the component dir (module-run puts the cwd first
#     on sys.path, which is how the in-repo package wins over anything stale).
#   - `server/` runs through BASH. 18 of its tests execute generated remote
#     scripts under a stub sudo/chown; launched from PowerShell they SKIP
#     SILENTLY and the summary prints PASS (measured 2026-08-10, OPS-6).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: these are minutes-long
# matrices and the older answer is never the one anyone wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Keeps pytest's own output ASCII-safe on the Windows runner, whose console
  # codepage is cp1252 and whose UnicodeEncodeError would be indistinguishable
  # from a real failure.
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Windows: everything that is Windows-first by construction. The companion is
  # ctypes Win32, a registry Run key, a logon task and Tk dialogs; the installer
  # is PowerShell.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # test_publish_password_hygiene.py and test_rclone_stanza_rewrite.py find
      # bash with `shutil.which("bash")`, i.e. whatever PATH says first -- and
      # windows-latest carries BOTH Git's bash (a real POSIX shell) and
      # `C:\Windows\System32\bash.exe` (the WSL launcher stub), with WSL
      # winning by default PATH order. WSL's bash.exe answers on stdout in
      # UTF-16 ("W<NUL>i<NUL>n<NUL>d<NUL>o<NUL>w<NUL>s..."), which reads as
      # every assertion about the script's stdout failing at once rather than
      # as "wrong interpreter". `GITHUB_PATH` entries are PREPENDED to PATH for
      # every later step (GitHub's own semantics), so this only has to run
      # once, before anything installs or tests.
      - name: put Git's bash ahead of WSL's on PATH
        # `C:\Program Files\Git\bin` is where the windows-latest runner image
        # actually puts bash.exe (git.exe itself lives in the sibling `cmd`
        # dir, which has no bash at all -- `$(git --exec-path)` resolves to
        # git's internal helper dir and is no use here either). Hardcoded
        # because it is the documented, stable layout of GitHub's own image,
        # not a guess.
        run: "'C:\\Program Files\\Git\\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            companion/requirements.lock
            onboarding/requirements.lock
            bench/requirements.lock

      # A venv per suite, from that suite's lock. They do not share one locally
      # either (CLAUDE.md), and the companion's tray extras have no business in
      # the bench environment.
      - name: companion -- install
        run: |
          python -m venv companion/.venv
          companion/.venv/Scripts/python -m pip install --disable-pip-version-check --require-hashes -r companion/requirements.lock

      # sidecar_tools.py / conftest.py's rclone_binary fixture looks on PATH
      # first, then companion/.tools/rclone.exe -- and windows-latest carries
      # no rclone at all, so every real-rclone lane-direction test (lane A
      # carries video UP only, lane B carries **/Proxy/** DOWN only -- the most
      # destructive thing in the system to get backwards) silently SKIPPED
      # rather than ran. Same pin `installer/windows_bootstrap.ps1` ships to
      # every editor ($RcloneVersion/$RcloneZipSha256), so the suite exercises
      # the exact build the fleet gets, not whatever `winget`/`choco` resolves
      # to today. Verified BEFORE extraction, same as the installer does.
      - name: install pinned rclone (companion suite needs a real binary)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $version = "v1.75.0"
          $sha256  = "203581f0a7baeae873f2347483a798c79e2eaf5c384a4e9d866aa374f1c89ac0"
          $url     = "https://downloads.rclone.org/$version/rclone-$version-windows-amd64.zip"
          $zip     = Join-Path $env:RUNNER_TEMP "rclone.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            throw "rclone download hash mismatch: expected $sha256, got $actual"
          }
          $extractDir = Join-Path $env:RUNNER_TEMP "rclone-extract"
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          New-Item -ItemType Directory -Force -Path companion/.tools | Out-Null
          $exe = Get-ChildItem -Path $extractDir -Filter "rclone.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "could not find rclone.exe inside the downloaded zip" }
          Copy-Item $exe.FullName "companion/.tools/rclone.exe" -Force

      - name: companion -- pytest
        if: ${{ !cancelled() }}
        working-directory: companion
        run: .venv/Scripts/python -m pytest tests -q --junitxml=../junit-companion.xml

      # --platform win32: the Windows half of the companion target's split
      # licence check (see the linux job's licence-gate comment and
      # tools/check_licenses.py's check() docstring). Never both halves in one
      # job -- pyobjc-core/-framework-cocoa's `sys_platform == 'darwin'`
      # marker means pip will never install them here no matter what.
      - name: licence gate (companion, win32)
        if: ${{ !cancelled() }}
        run: companion/.venv/Scripts/python.exe tools/check_licenses.py --strict --only companion --platform win32

      - name: onboarding -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv onboarding/.venv
          onboarding/.venv/Scripts/python -m pip install --disable-pip-version-check --require-hashes -r onboarding/requirements.lock
      - name: onboarding -- pytest
        if: ${{ !cancelled() }}
        working-directory: onboarding
        run: .venv/Scripts/python -m pytest tests -q --junitxml=../junit-onboarding.xml

      - name: bench -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv bench/.venv
          bench/.venv/Scripts/python -m pip install --disable-pip-version-check --require-hashes -r bench/requirements.lock
      - name: bench -- pytest
        if: ${{ !cancelled() }}
        working-directory: bench
        run: .venv/Scripts/python -m pytest tests -q --junitxml=../junit-bench.xml

      # The drive-map parser is the piece that decides whether P: gets torn down
      # and remounted on an editor's machine, and it has no Python test.
      - name: installer -- drive-map parser
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File installer/tests/Test-DriveMapParser.ps1

      - name: upload junit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows
          path: junit-*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux: the container half, plus the checks that only make sense on a POSIX
  # filesystem (the CRLF gate) and the licence gate.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.lock
            broll/web/requirements.lock
            music/web/requirements.lock
            ytdl/web/requirements.lock
            broll/indexer/requirements.lock
            server/requirements.lock

      # THE CRLF GATE. A CRLF run.sh took the dashboard down once (`set -eu` ->
      # "Illegal option -", dash reading the CR as an option character) and
      # installer/macos_bootstrap.sh had the same defect while already sitting on
      # the editor share. .gitattributes now forces eol=lf on those files -- but
      # a working copy checked out BEFORE a rule was added stays CRLF, and MSYS
      # grep STRIPS a CR before matching, so the developer-side check lies.
      # Byte-scan instead, on a runner that checks out fresh (2026-08-10).
      - name: line endings -- no CR in any shell script
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if [ -f "$f" ] && LC_ALL=C grep -qU $'\r' "$f"; then
              echo "CR found in $f"; bad=1
            fi
          done < <(git ls-files '*.sh' '*.bash' 'dashboard/deploy/run.sh' \
                                'dashboard/deploy/Dockerfile' 'broll/web/Dockerfile' \
                                'dashboard/deploy/*.yaml' '.github/workflows/*.yml')
          if [ "$bad" -ne 0 ]; then
            echo "A CR in a file the NAS container or a Mac executes is a crash-loop, not a style nit."
            exit 1
          fi
          echo "no CR in any tracked shell script"

      - name: line endings -- git agrees with .gitattributes
        run: |
          set -euo pipefail
          # `git ls-files --eol` reports i/<index> w/<worktree>. Anything the
          # attributes say is lf must be lf in the index too; a file committed
          # with CRLF before the rule existed still shows i/crlf here.
          bad="$(git ls-files --eol '*.sh' '*.bash' 'dashboard/deploy/Dockerfile' \
                              'broll/web/Dockerfile' 'dashboard/deploy/*.yaml' \
                              '.github/workflows/*.yml' | grep -v 'i/lf' || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "These are committed with CRLF despite .gitattributes' eol=lf."
            echo "Fix with: rm <file> && git checkout -- <file>"
            exit 1
          fi
          echo "every tracked shell script is lf in the index"

      - name: dashboard -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv dashboard/.venv
          dashboard/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r dashboard/requirements.lock
      - name: dashboard -- pytest
        if: ${{ !cancelled() }}
        working-directory: dashboard
        # PYTHONPATH=src rather than an editable install: the package lives under
        # src/ and `python -m pytest` only puts the component dir itself first.
        # It is also what deploy/run.sh does in production.
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest tests -q --junitxml=../junit-dashboard.xml

      # THROUGH BASH, and reusing the dashboard venv exactly as CLAUDE.md says:
      # server/ has no venv of its own. This is the suite `ship` already gates
      # on, because it guards the deploy script.
      - name: server -- pytest (bash)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: server
        run: ../dashboard/.venv/bin/python -m pytest tests -q --junitxml=../junit-server.xml

      - name: broll/web -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv broll/web/.venv
          broll/web/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r broll/web/requirements.lock
      - name: broll/web -- pytest
        if: ${{ !cancelled() }}
        working-directory: broll/web
        # test_mounted_prefix.py pins the document-relative URLs the /broll
        # mount depends on; CLAUDE.md calls it load-bearing.
        run: .venv/bin/python -m pytest tests -q --junitxml=../../junit-broll-web.xml

      - name: music/web -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv music/web/.venv
          music/web/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r music/web/requirements.lock
      - name: music/web -- pytest
        if: ${{ !cancelled() }}
        working-directory: music/web
        run: .venv/bin/python -m pytest tests -q --junitxml=../../junit-music-web.xml

      - name: ytdl/web -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv ytdl/web/.venv
          ytdl/web/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r ytdl/web/requirements.lock
      - name: ytdl/web -- pytest
        if: ${{ !cancelled() }}
        working-directory: ytdl/web
        run: .venv/bin/python -m pytest tests -q --junitxml=../../junit-ytdl-web.xml

      # CPU only. The `embeddings` extra (fastembed) is not installed and the
      # slow marker's tests skip themselves when the model is not cached, so
      # nothing here downloads a model. music/indexer is deliberately ABSENT
      # from this job: its dependency set is torch + the CUDA wheels, which
      # belongs to the GPU image (COMMERCIAL_READINESS.md item 14), not here.
      - name: broll/indexer -- install
        if: ${{ !cancelled() }}
        run: |
          python -m venv broll/indexer/.venv
          broll/indexer/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r broll/indexer/requirements.lock
          # broll_index/embed.py imports numpy UNCONDITIONALLY (its own
          # docstring: "fastembed is an OPTIONAL import" -- true of fastembed,
          # not of the numpy import three lines above the try/except that
          # guards it), so every test that reaches broll_index.pipeline dies
          # at collection without it. requirements.lock was compiled with only
          # `--extra dev` (see its own header comment) and has never carried
          # numpy or fastembed; the `embeddings` extra (pyproject.toml) is
          # what would pull both in, and stays OUT here on purpose -- fastembed
          # is the ONNX runtime, this job needs numpy importable, nothing more,
          # and the suite's own model-dependent tests already skip themselves
          # when nothing is cached. Pinned to the SAME version broll/web and
          # music/web already hash-lock (numpy==2.5.2), so this is not a
          # floating dependency -- just installed without --require-hashes,
          # because the indexer is not a conveyed artefact
          # (tools/check_licenses.py's own docstring: only companion and the
          # dashboard container are) and this is a test-time import only. Do
          # NOT regenerate broll/indexer/requirements.lock for this.
          broll/indexer/.venv/bin/python -m pip install --disable-pip-version-check "numpy==2.5.2"
      - name: broll/indexer -- pytest
        if: ${{ !cancelled() }}
        working-directory: broll/indexer
        run: .venv/bin/python -m pytest tests -q --junitxml=../../junit-broll-indexer.xml

      # music/indexer's DEPENDENCY SET is torch + the CUDA wheels and stays out
      # of CI (see above) -- but its SUITE is deliberately torch-free
      # (test_config_paths.py's docstring says so, and it is the check that the
      # indexer refuses to guess a customer's library path rather than baking
      # one in). So it runs here with NO lock install, on the dashboard venv,
      # exactly as tools/run_all_tests.ps1 runs it on the system interpreter.
      # Added 2026-08-17: CI and run_all_tests.ps1 must list the same suites,
      # or "green locally" and "green in CI" mean different things.
      - name: music/indexer -- pytest (no torch; the suite is the path/config half)
        if: ${{ !cancelled() }}
        working-directory: music/indexer
        run: ../../dashboard/.venv/bin/python -m pytest tests -q --junitxml=../../junit-music-indexer.xml

      - name: tools -- pytest
        if: ${{ !cancelled() }}
        working-directory: tools
        run: ../dashboard/.venv/bin/python -m pytest tests -q --junitxml=../junit-tools.xml

      # The macOS bootstrap's string helpers -- the site-manifest reader, the
      # canonical_prefix -> drive-letter rule, the pinned-download verifier and
      # the "no com.creatorsclub.* label is written again" check. Pure bash and
      # no Mac required, which is the point of slicing them out of
      # macos_bootstrap.sh; run here so they gate a PR rather than only the
      # developer's own run_all_tests.ps1 (2026-08-17).
      - name: installer -- macOS bootstrap site values (bash)
        if: ${{ !cancelled() }}
        run: bash installer/tests/test_macos_site_values.sh

      # --strict --only dashboard-container --platform linux: every lock this
      # target needs (dashboard, music/web, ytdl/web) has been installed above
      # into dashboard-container's own venv list, so an UNSCANNED package here
      # is a real gap. NOT the companion target: its lock is win32+darwin, and
      # nothing a Linux runner installs will ever satisfy either half -- that
      # half of the gate runs on the windows and macos jobs instead, each with
      # --only companion --platform <its own OS>, so the two OS-specific
      # strict runs together cover companion's full closure without either job
      # reporting the OTHER OS's packages as an unscannable failure it could
      # never fix (tools/check_licenses.py's check() docstring, 2026-08-17).
      - name: licence gate (dashboard-container)
        if: ${{ !cancelled() }}
        run: dashboard/.venv/bin/python tools/check_licenses.py --strict --only dashboard-container --platform linux

      - name: upload junit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-linux
          path: junit-*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS. The port is code-complete and has real platform branches everywhere,
  # and until this job existed none of them ran anywhere. The build smoke is
  # `--dry-run`, which the script supports and which changes, builds and
  # publishes NOTHING -- the real build lives in release-macos.yml.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: companion/requirements.lock

      - name: companion -- install
        run: |
          python -m venv companion/.venv
          companion/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r companion/requirements.lock

      # Same reasoning as the windows job's rclone step: without a real
      # binary, every lane A/B direction test silently SKIPS instead of
      # running. macos-latest is Apple Silicon, hence osx-arm64; same pin
      # macos_bootstrap.sh ships to every editor Mac.
      - name: install pinned rclone (companion suite needs a real binary)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version="v1.75.0"
          sha256="35e8f2a666ce789b29111db0dd843ddabc0d59c6b609d07bcaae5d1a07cba6f8"
          url="https://downloads.rclone.org/$version/rclone-$version-osx-arm64.zip"
          zip="$RUNNER_TEMP/rclone.zip"
          curl -fsSL "$url" -o "$zip"
          actual="$(shasum -a 256 "$zip" | awk '{print $1}')"
          if [ "$actual" != "$sha256" ]; then
            echo "rclone download hash mismatch: expected $sha256, got $actual" >&2
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/rclone-extract"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q -o "$zip" -d "$extract_dir"
          found="$(find "$extract_dir" -name rclone -type f | head -n 1)"
          if [ -z "$found" ]; then
            echo "could not find rclone binary inside the downloaded zip" >&2
            exit 1
          fi
          mkdir -p companion/.tools
          cp "$found" companion/.tools/rclone
          chmod +x companion/.tools/rclone

      # The suite spawns REAL Tk dialogs if a fixture is bypassed (CLAUDE.md).
      # A macOS runner has no window server for a login session, so a stray
      # dialog HANGS rather than failing -- hence the job timeout above, which
      # is the difference between a red build and a stuck one.
      - name: companion -- pytest
        if: ${{ !cancelled() }}
        working-directory: companion
        run: .venv/bin/python -m pytest tests -q --junitxml=../junit-companion-macos.xml

      # --platform darwin: the macOS half of companion's split licence check
      # (see the linux job's licence-gate comment). colorama's `sys_platform
      # == 'win32'` marker means pip will never install it here.
      - name: licence gate (companion, darwin)
        if: ${{ !cancelled() }}
        run: companion/.venv/bin/python tools/check_licenses.py --strict --only companion --platform darwin

      # Inspection only: prints every step, builds nothing, publishes nothing,
      # and needs neither the dashboard nor an admin account.
      - name: macOS release script -- dry run
        if: ${{ !cancelled() }}
        run: ./tools/release_macos.sh --dry-run --skip-tests --allow-dirty

      - name: upload junit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos
          path: junit-*.xml
          if-no-files-found: warn
